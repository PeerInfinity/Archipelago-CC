name: Substrate tests — bot walks (manual)

# ⛓ THE REAL-TIME OMSI BOT WALKS, ON DEMAND ONLY (slice ci-batches-C1,
# 2026-09-27; plan quick-launch-panel-plan.md §22–§23).
#
# ⚖ USER RULING (2026-09-27): "make the slow batch manual only, and also move
# it to either a different workflow or a separate job." ⇒ `workflow_dispatch:`
# and NOTHING ELSE — never push, pull_request or schedule. A separate workflow
# rather than a manual-only job inside test-templates.yml, because such a job
# would show as `skipped` on every push run of that workflow.
#
# The batch is `bot-walks` (frontend/modules/tests/testBatches.js: the
# `Omsi bot walks` category — the walks drive the game loop at human pace, so
# they are minutes each by design). test-templates.yml runs every other
# substrate category on push, as `--batch=fast`.
#
# `npm test` serves the tree itself: playwright.config.js's `webServer` runs
# `python -m http.server <TEST_PORT>` (scripts/test/testServer.js), so no
# server step is needed here.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: >-
          The test-substrates batch to run (testBatches.js): bot-walks (the
          real-time omsi bot walks) or fast (everything else).
        type: string
        default: bot-walks

jobs:
  bot-walks:
    name: Substrate tests — ${{ inputs.batch }} batch
    runs-on: ubuntu-latest
    # Sized so the in-app runner's own budget fires first (AUTO_START_TIMEOUT_MS,
    # 600 s, testLogic.js): measured 2026-09-27 the batch takes 366 s in-app on
    # the runner (a main run's rows: 279.6 + 81.8 + 4.9 s) and 378 s on the box,
    # and test-templates.yml's setup steps take ~83 s — so a run at the full
    # budget still ends near 12 minutes, and 20 leaves the margin for a slow
    # cache-miss install.
    timeout-minutes: 20

    steps:
      # ── the same setup as test-templates.yml, minus the Python venv the
      #    ALTTP spoiler test needs (the in-app substrate tests read only the
      #    committed presets and the submodules) ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '~3.12.7'
          check-latest: true

      - name: Cache Node.js dependencies
        uses: actions/cache@v6.1.0
        id: cache-node
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Node.js dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: |
          npx playwright install chromium

      - name: Run substrate tests (${{ inputs.batch }} batch)
        env:
          BATCH: ${{ inputs.batch }}
        run: |
          npm test -- --mode=test-substrates --batch="$BATCH"

      # always(): a run cancelled at its cap still uploads what it produced.
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.0
        with:
          name: test-results-${{ inputs.batch }}
          path: |
            test-results/
            playwright-report.json
          retention-days: 7
