# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: unittests

on:
  push:
    paths:
      - '**'
      - '!docs/**'
      - '!deploy/**'
      - '!setup.py'
      - '!Dockerfile'
      - '!*.iss'
      - '!.gitignore'
      - '!.dockerignore'
      - '!.github/workflows/**'
      - '.github/workflows/unittests.yml'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!deploy/**'
      - '!setup.py'
      - '!Dockerfile'
      - '!*.iss'
      - '!.gitignore'
      - '!.dockerignore'
      - '!.github/workflows/**'
      - '.github/workflows/unittests.yml'

permissions: {}

# Fork addition (ci-workflow-policy-review F3): a branch push supersedes the
# run of the previous push to the SAME branch. Only pushes to non-main refs
# share a group; main, pull requests and dispatches get a group of their own
# (the run id), so they never cancel or queue behind each other — main's
# per-SHA rows are what post-merge readers cite.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Fork addition (ci-workflow-policy-review F1): a push to a branch other than
  # main whose changes pytest never reads (frontend JS, scripts/procgen data,
  # prose) skips the matrix. Main and pull requests always run it. The decision
  # is scripts/test/python-tests-needed.py (pinned by
  # test/test_python_tests_needed.py); every failure to get the changed-file
  # list runs the matrix.
  changes:
    runs-on: ubuntu-latest
    name: Python tests needed?
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        sparse-checkout: scripts/test/python-tests-needed.py
        sparse-checkout-cone-mode: false
    - name: Decide
      id: decide
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        BEFORE: ${{ github.event.before }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
      run: |
        decide() {
          if [ "$EVENT" != "push" ] || [ "$REF" = "refs/heads/main" ]; then
            echo "run: $EVENT on $REF always runs"; echo true; return
          fi
          # A new branch has no `before`: compare against main's merge-base.
          base="$BEFORE"
          case "$base" in ''|0000000000000000000000000000000000000000) base=main ;; esac
          if ! files=$(gh api "repos/$REPO/compare/$base...$SHA" --jq '.files[].filename'); then
            echo "run: could not list the changes ($base...$SHA)" >&2; echo true; return
          fi
          n=$(printf '%s\n' "$files" | grep -c . || true)
          # The compare API lists at most 300 files: a longer list is truncated.
          if [ "$n" -ge 300 ]; then echo "run: $n changed files (list may be truncated)" >&2; echo true; return; fi
          echo "$n changed file(s) in $base...$SHA:" >&2; printf '%s\n' "$files" | sed 's/^/  /' >&2
          printf '%s\n' "$files" | python3 scripts/test/python-tests-needed.py
        }
        run=$(decide | tail -1)
        # Anything but an explicit "false" (a crashed classifier prints nothing) runs.
        [ "$run" = false ] || run=true
        echo "Python tests needed: $run"
        echo "run=$run" >> "$GITHUB_OUTPUT"

  unit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    name: Test Python ${{ matrix.python.version }} ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python:
          - {version: '3.11.2'} # Change to '3.11' around 2026-06-10
          - {version: '3.12'}
          - {version: '3.13'}
        include:
          - python: {version: '3.11'}  # old compat
            os: windows-latest
          - python: {version: '3.13'}  # current
            os: windows-latest
          - python: {version: '3.13'}  # current
            os: macos-latest

    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python ${{ matrix.python.version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python.version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ci-requirements.txt
        python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
    # Its OWN step so the env below cannot reach the installer above, which
    # SKIP_REQUIREMENTS_UPDATE would disable. Launcher.py:28 calls
    # ModuleUpdate.update() with NO arguments, i.e. yes=False, so any
    # requirement the installer failed to fetch makes it call input() — on a
    # runner with no stdin that is an EOFError naming the prompt instead of
    # the install failure. That second check is redundant in CI.
    # ⚠ Must be `env:`, NOT a `VAR=1 cmd` prefix: the Windows runners default
    # to PowerShell, where that POSIX form is parsed as a command name and
    # fails with "The term 'SKIP_REQUIREMENTS_UPDATE=1' is not recognized".
    - name: Create host.yaml for tests
      env:
        SKIP_REQUIREMENTS_UPDATE: "1"
      run: |
        python Launcher.py --update_settings
    - name: Unittests
      env:
        # Same prompt, one step later: a missing requirement makes world
        # loading call input() under pytest's capture, which raises
        # "OSError: pytest: reading from stdin while output is captured" on
        # every affected test (42 of them on 2026-08-13) and buries the real
        # cause. With this set, a genuinely missing dependency surfaces as an
        # ImportError that test_no_failed_world_loads names.
        SKIP_REQUIREMENTS_UPDATE: "1"
        # Force UTF-8 stdio. Without this, Python 3.11 on Windows defaults
        # sys.stdout to a cp1252 TextIOWrapper, and pytest-xdist's parent-
        # worker stdout teardown trips a "ValueError: underlying buffer has
        # been detached" inside _pytest.config.console_main's final
        # sys.stdout.flush() — failing the job after every test passed.
        # Python 3.13 uses UTF-8 by default and is unaffected.
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
      run: |
        pytest -n auto

  hosting:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    name: Test hosting with ${{ matrix.python.version }} on ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
        python:
          - {version: '3.13'}  # current

    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python ${{ matrix.python.version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python.version }}
    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip
        python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
    - name: Test hosting
      env:
        # This test spawns Generate.py / MultiServer.py as SUBPROCESSES, and
        # each runs ModuleUpdate.update() at __main__ with yes=False. A
        # dependency that failed to install therefore turns into an input()
        # call with no stdin — EOFError, red job, and a message that names the
        # prompt rather than the install failure. Safe here: the install step
        # above already ran ModuleUpdate --yes --force.
        SKIP_REQUIREMENTS_UPDATE: "1"
      run: |
        source venv/bin/activate
        export PYTHONPATH=$(pwd)
        timeout 600 python test/hosting/__main__.py
