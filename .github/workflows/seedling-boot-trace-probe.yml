name: Seedling ship boot-trace probe (S1 task 1, throwaway)

# ⛓ THROWAWAY — slice seedling-headless-S1 task 1 (plan
# NewDocs/plans/seedling-headless-webgpu-plan.md §15.1 item 1). Deleted in a
# later commit of the same slice.
#
# CAMPAIGN CLAIM 6 reads `game 38 vs model 40 − 1` on ubuntu-latest and 39 on
# the box. This runs `check-seedling-wasm-ship.mjs --boot-trace` on the runner,
# twice in parallel, exactly as the browser shard runs it (same checkout, node,
# Chromium, venv and :8000 server), and prints window 1's per-frame boot trace
# for both chain arms. It asserts nothing; the gate's own verdict is printed.

on:
  workflow_dispatch:

jobs:
  trace:
    name: boot trace ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve the pinned Playwright version (the cache key)
        id: pwver
        run: |
          V=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pwver.outputs.version }}

      - name: Install Chromium for Playwright
        timeout-minutes: 12
        run: |
          node node_modules/playwright/cli.js install chromium
          ls -1 ~/.cache/ms-playwright

      - name: Python Playwright for the headless driver channel
        timeout-minutes: 5
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r scripts/procgen/requirements-headless.txt

      - name: 'Run the ship gate with --boot-trace'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          nproc; grep -m1 "model name" /proc/cpuinfo
          python3 -m http.server 8000 >/tmp/httpd.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8000/frontend/index.html && break
            sleep 1
          done
          set +e
          node scripts/procgen/check-seedling-wasm-ship.mjs --boot-trace \
            --host=http://localhost:8000 > /tmp/ship.log 2>&1
          echo "EXIT=$?" >> /tmp/ship.log
          grep -a -E 'BOOT-TRACE|CLAIM 6|CHECK|WEBGPU_ADAPTER|CHANNEL|EXIT=' /tmp/ship.log

      - name: Upload the full log
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: boot-trace-${{ matrix.run }}
          path: /tmp/ship.log
