name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build

      # ⛓⛓ THE PROCGEN DOCUMENTS ARE PART OF THE SITE, and this is the only
      # step that makes that true. `frontend/modules/procgenDocs/docs.html`
      # FETCHES the tracked `.md` files at run time from a site-root-relative
      # path — `<siteRoot>/docs/json/developer/procgen/<file>`. Locally that
      # resolves because the dev server serves the REPO ROOT. Here only
      # `./frontend` is uploaded, so without this copy the same path 404s and
      # every one of the eighteen documents fails to load.
      #
      # ⛔ `frontend/docs/` is in .gitignore, so this copy exists only in the
      # artifact and a local one can never be committed by accident.
      # ⛓ Proved before it ever ran, by building this exact shape locally and
      # running `scripts/procgen/check-procgen-docs.mjs --host=` against it.
      - name: Stage the procgen documents into the site
        run: |
          mkdir -p frontend/docs/json/developer
          cp -r docs/json/developer/procgen frontend/docs/json/developer/procgen

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          # Upload only the frontend directory
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
