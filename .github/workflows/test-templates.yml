name: Test ALTTP Spoiler & Frontend Regression

on:
  # Run on push to main branch
  push:
    branches:
      - main
    paths:
      - 'Players/Templates/*.yaml'
      - 'scripts/test/**'
      - 'frontend/**'
      - 'test_json/**'
      - '.github/workflows/test-templates.yml'

  # Run on pull requests
  pull_request:
    paths:
      - 'Players/Templates/*.yaml'
      - 'scripts/test/**'
      - 'frontend/**'
      - 'test_json/**'
      - '.github/workflows/test-templates.yml'

  # Allow manual triggering
  workflow_dispatch:

jobs:
  test-alttp-and-regression:
    name: Test ALTTP Spoiler & Frontend Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '~3.12.7'
          check-latest: true

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt -y install python3-gi libgirepository1.0-dev

      - name: Cache Python virtual environment
        uses: actions/cache@v6.1.0
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Create virtual environment and install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ModuleUpdate
        run: |
          source .venv/bin/activate
          python ModuleUpdate.py --yes

      - name: Generate template files
        run: |
          source .venv/bin/activate
          python -c "from Options import generate_yaml_templates; generate_yaml_templates('Players/Templates')"

      - name: Configure host settings
        run: |
          source .venv/bin/activate
          python Launcher.py --update_settings
          python scripts/setup/update_host_settings.py minimal-spoilers

      - name: Cache Node.js dependencies
        uses: actions/cache@v6.1.0
        id: cache-node
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Node.js dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: |
          source .venv/bin/activate
          npx playwright install chromium

      - name: Run ALTTP spoiler test (with HTTP server)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # Start HTTP server in background
          python -m http.server 8000 &
          SERVER_PID=$!
          sleep 2

          # Run template test
          source .venv/bin/activate
          python scripts/test/test-all-templates.py --include-list "A Link to the Past.yaml" -p

          # Stop HTTP server
          kill $SERVER_PID || true
          sleep 1

      - name: Run regression tests
        run: |
          npm test -- --mode=test-regression

      - name: Run substrate tests
        run: |
          npm test -- --mode=test-substrates

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.0
        with:
          name: test-results
          path: |
            scripts/output/
            docs/json/developer/test-results/
            test-results/
          retention-days: 7
