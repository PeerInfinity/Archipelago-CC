name: Test ALTTP Spoiler & Frontend Regression

# Two kinds of job (slice tests-batch-split, 2026-10-09):
#   - test-alttp-and-regression: the ALTTP spoiler test + the regression roster
#     on both boots;
#   - substrates: one PARALLEL matrix job per ON-PUSH test-substrates batch.
#     The batch list is not written here: the `batches` job reads it off
#     frontend/modules/tests/testBatches.js (every batch not marked
#     `manual: true`), so a new batch joins push by its own definition. Each
#     batch is its own job, so one batch's red cannot skip another (on main
#     before this, a red `fast` step skipped the `apworld` step after it), and
#     each races its own 600 s in-app budget (AUTO_START_TIMEOUT_MS).
#   Manual batches run in test-substrates-manual.yml.

on:
  # Run on push to main branch
  push:
    branches:
      - main
    paths:
      - 'Players/Templates/*.yaml'
      - 'scripts/test/**'
      - 'frontend/**'
      - 'test_json/**'
      - '.github/workflows/test-templates.yml'

  # Run on pull requests
  pull_request:
    paths:
      - 'Players/Templates/*.yaml'
      - 'scripts/test/**'
      - 'frontend/**'
      - 'test_json/**'
      - '.github/workflows/test-templates.yml'

  # Allow manual triggering
  workflow_dispatch:

jobs:
  test-alttp-and-regression:
    name: Test ALTTP Spoiler & Frontend Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '~3.12.7'
          check-latest: true

      - name: Cache Python virtual environment
        uses: actions/cache@v6.1.0
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Create virtual environment and install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ModuleUpdate
        run: |
          source .venv/bin/activate
          python ModuleUpdate.py --yes

      - name: Generate template files
        run: |
          source .venv/bin/activate
          python -c "from Options import generate_yaml_templates; generate_yaml_templates('Players/Templates')"

      - name: Configure host settings
        run: |
          source .venv/bin/activate
          python Launcher.py --update_settings
          python scripts/setup/update_host_settings.py minimal-spoilers

      - name: Cache Node.js dependencies
        uses: actions/cache@v6.1.0
        id: cache-node
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Node.js dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: |
          source .venv/bin/activate
          npx playwright install chromium

      - name: Run ALTTP spoiler test (with HTTP server)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # Start HTTP server in background
          python -m http.server 8000 &
          SERVER_PID=$!
          sleep 2

          # Run template test
          source .venv/bin/activate
          python scripts/test/test-all-templates.py --include-list "A Link to the Past.yaml" -p

          # Stop HTTP server
          kill $SERVER_PID || true
          sleep 1

      - name: Run regression tests
        run: |
          npm test -- --mode=test-regression

      # The same roster on the BUNDLED boot (frontend/dist/bundle.js) — what a
      # deployed site serves first. `--bundled` builds the bundle itself before
      # Playwright starts; its results file is flavour-stamped, so it lands in
      # test-results/ beside the unbundled one without being compared to it.
      - name: Run regression tests (bundled boot)
        run: |
          npm test -- --mode=test-regression --bundled

      # always(), not !cancelled(): a job cancelled at its cap is exactly the
      # run whose passing steps' results are worth keeping — under !cancelled()
      # the upload was skipped and nothing uploaded for two weeks.
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.0
        with:
          name: test-results
          path: |
            scripts/output/
            docs/json/developer/test-results/
            test-results/
          retention-days: 7

  # The on-push batch list, read off testBatches.js. No submodules and no
  # npm install: the module has no imports.
  batches:
    name: On-push substrate batches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: List the on-push batches
        id: list
        run: |
          list=$(node scripts/test/list-test-batches.js --on-push)
          echo "On-push batches: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  substrates:
    name: Substrate tests — ${{ matrix.batch }} batch
    needs: batches
    runs-on: ubuntu-latest
    # Sized so the in-app runner's own 600 s budget fires first; the setup
    # below is the bot-walks job's (no Python venv: the in-app substrate tests
    # read only the committed presets and the submodules).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.batches.outputs.list) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '~3.12.7'
          check-latest: true

      - name: Cache Node.js dependencies
        uses: actions/cache@v6.1.0
        id: cache-node
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Node.js dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: |
          npx playwright install chromium

      - name: Run substrate tests (${{ matrix.batch }} batch)
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          npm test -- --mode=test-substrates --batch="$BATCH"

      # Grades the run just made against its in-app budget
      # (scripts/test/check-batch-headroom.js): fails on NEVER STARTED / CUT OFF
      # rows or a span over budget, annotates a WARNING past the headroom
      # fraction — so a batch creeping up on its budget is named before it
      # starts dropping its tail. !cancelled(): a red run is exactly the one
      # whose headroom is worth reading.
      - name: Budget headroom (${{ matrix.batch }} batch)
        if: ${{ !cancelled() }}
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          node scripts/test/check-batch-headroom.js --mode=test-substrates --batch="$BATCH"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.0
        with:
          name: test-results-${{ matrix.batch }}
          path: |
            test-results/
            playwright-report.json
          retention-days: 7
