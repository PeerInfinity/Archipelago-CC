name: Seedling divergence sweep (manual)

# ⛓ THE LIVE WASM DIVERGENCE SWEEP, ON RUNNERS, ON DEMAND ONLY (measure-only; planner seedling-js-planning-3).
# Every exit / location leg of seedling_playthrough, from each resolved arrival, with the AP route's inventory,
# served by the PRODUCTION wasm playback engine on the live page; one jsonl row per leg (the engine's history,
# the plans, and each divergence's model and game rows). Nothing is asserted about the MODEL: a refusal or a
# divergence is a row, not a red job. The jobs go red only when the SWEEP itself is incomplete.
#
# ⚖ USER RULING (2026-10-05, via planner-3): the live sweep runs in CI, SHARDED, off the box.
# ⇒ `workflow_dispatch:` and NOTHING ELSE — never push, pull_request or schedule.
#   plan   the leg list (`seedling-divergence-legs.mjs`, pure node) and its partition
#          (`probe-seedling-divergence-sweep.mjs --shard-plan=<n> --json`: price-balanced, longest first, so the
#          location legs and the big rooms spread across shards). No browser.
#   shard  `--shard=i/n` per matrix entry, headless logic-only; asserts the CHANNEL line; uploads its rows.
#   merge  concatenates the shards' rows and fails BY NAME (`scripts/procgen/seedlingDivergenceMerge.js`) when the
#          distinct leg ids != the plan's leg count, a leg's page never booted, a leg's page HUNG in a harness step
#          (`end: 'harness-hang'`, H1), or a shard never reported ids of its plan — those are listed per shard, and
#          their union printed as `REDISPATCH ids=…` (the `ids` input of the re-run, as is) — and a MIXED-BUDGET
#          merge (rows whose `legBudgetMs` stamp differs from the plan's: S5-1's `leg_budget_ms`), and a MIXED-WINDOW merge
#          (rows whose `upgradeWindowWork` / `dashOnlyWindow` / `dashShape` stamp differs from the plan's:
#          `upgrade_window_work`, `dash_only_window`, `dash_shape`).
#
# ⛓ H1 (sweep-4 shard 9, run 38110831520, sat ~5 h after page 18 and named nothing): every harness step between
# legs runs under a MEASURED wall-clock bound in the probe (`HANG_BOUNDS_MS`); one that expires prints `HANG:`,
# SIGKILLs the browser, emits the page's unreported legs as `harness-hang`, and the shard moves on.
#
# ⛓ HEADLESS LOGIC-ONLY, as the full tier: the probe launches on HEADLESS_LOGIC_ONLY_ARGS and refuses unless the
# page's `__swfGpu.lost >= 1` (`assertLogicOnlyChannel`), printing the CHANNEL line each shard greps.
# ⚠ The solver's budget is WALL-CLOCK: a runner's 2 shared CPUs can cut a solve the box would finish. The report
# tags those legs BUDGET-BOUND and re-runs them before calling any a model gap.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: The number of shard jobs the leg list is split across.
        type: number
        default: 10
      page:
        description: The wasm build to drive (a directory under frontend/modules/flashPanel/wasm).
        type: string
        default: seedling_bot_ap_p4f
      mode:
        description: inv (the AP route's inventory, granted through the AP path) or bare (no grants).
        type: string
        default: inv
      producer:
        description: solver (the production engine) or walker (the same engine built the WG way — the J2 walker's tape).
        type: string
        default: solver
      page_legs:
        description: >-
          Legs per page. 1 = one clean game per leg, its start ASSERTED empty (the game's items are session-wide:
          a leg's pickups leaked into later legs on a shared page — planner-3's trace, 2026-10-05).
        type: number
        default: 1
      ids:
        description: Comma-separated leg ids to run (empty = every leg) — the BUDGET-BOUND re-run, the walker pass.
        type: string
        default: ''
      keys:
        description: >-
          '|'-separated leg KEYS to run (seedling-divergence-legs.legKey; stable across SHAs, where an id shifts).
          An unknown key fails the plan by name. Combines with ids (either selects).
        type: string
        default: ''
      stage_events:
        description: >-
          true = an event-gated arrival's flags are written into the game before its jump (the test-harness
          staging); false = the MUTANT / control (--no-stage-events: the legs land inside their obstacles).
        type: boolean
        default: true
      stage_flags:
        description: >-
          MEASUREMENT ONLY, empty for every real sweep. '<leg key>=><level>:<tag>[,<level>:<tag>…]', '|'-separated:
          those legs ALSO stage the named removed flags through the event staging's channel (the game's setter, the
          read-back, stage-failed, a page of their own); their rows carry `stagedFlags`. An unknown key fails the plan
          by name. Pair it with `keys` to run only the staged leg(s).
        type: string
        default: ''
      contact_fidelity:
        description: >-
          Empty = the model's contact switches at their defaults (today's run). Otherwise the ON keys of
          contactFidelity.js (comma-separated; every other OFF), or all / none — set through the flashPanel settings
          (the CONTACT hook), read back as a CONTACT line, and stamped on each plan the worker solved under it.
        type: string
        default: ''
      axe_dodge:
        description: >-
          Empty = fidelity's AXE_DODGE_ASK_PER_PREVIEW at the model's own default (today's run). Otherwise on / off —
          set through the flashPanel setting seedlingAxeDodgeAskPerPreview (the AXE_DODGE hook), read back as an
          AXE_DODGE line, and stamped on each plan the worker solved under an off-default value.
        type: string
        default: ''
      upgrade_window_work:
        description: >-
          Empty = the solver's upgrade window at the engine's own 85 work units (today's run). Otherwise the window in
          work units (0 = the whole budget) — set through the flashPanel setting seedlingSolverUpgradeWindowWork before
          the panel boots, read back as an UPGRADE-WINDOW line, so every solve request carries it as its
          upgradeWindowWork. Every row and the plan are stamped upgradeWindowWork, and the merge refuses a mixed-window
          merge by name. capture_requests reads the requests back.
        type: string
        default: ''
      dash_only_window:
        description: >-
          Empty = the solver's DASH_ONLY_WINDOW at its own default, ON since the dash flip (today's run). Otherwise on / off — set through
          the flashPanel setting seedlingDashOnlyWindow (on = the upgrade window counts only sword-dash asks and stops
          only that search), read back as a DASH_ONLY_WINDOW line, stamped on each plan the worker solved off-default,
          on every row and on the plan; the merge refuses a mixed merge by name.
        type: string
        default: ''
      dash_shape:
        description: >-
          Empty = solverBot's three SEEDLING DB dash switches at their own defaults (legPrecheck and keepPartial ON, noSwingPrefix OFF, since the dash flip; today's run). Otherwise a spec:
          a comma list of <key>:on|off over legPrecheck, noSwingPrefix, keepPartial (a bare key = on), or all — set
          through the flashPanel settings seedlingDash{LegPrecheck,NoSwingPrefix,KeepPartial}, read back as a DASH_SHAPE
          line, stamped dashShape on each request the engine makes off-default (capture_requests reads it back), on
          every row and on the plan; the merge refuses a mixed merge by name.
        type: string
        default: ''
      leg_budget_ms:
        description: >-
          Empty = the harness's 90000 ms per leg (today's run). Otherwise the leg budget in ms (S5-1: a LONG search
          reads `timeout` exactly like an impossible one at 90 s). Off the default every row is stamped legBudgetMs,
          a timeout row names its bound (`cut`), the leg hang bound and the shard timeout grow with it, and the merge
          refuses a mixed-budget merge by name. ⛔ The harness's clock only: the solver's work-unit budgets and its own
          300 s backstop (a named failure) are untouched.
        type: string
        default: ''
      capture_requests:
        description: >-
          Off = today's run. On = each shard also writes requests-<i>.jsonl (in its artifact): every solve request a
          leg made, in order, as the worker received it, with its pass rows and work units — the input
          replay-seedling-solve-request.mjs replays in node. The rows are unchanged.
        type: boolean
        default: false
      seam_census:
        description: >-
          Empty = off. Otherwise '<from>..<to>' (ticks): after the shards, each leg's FIRST captured request is
          re-solved in node at every arrival game clock captured+d (only staging.seam.time moves;
          replay-seedling-solve-request.mjs --seam-time-sweep), 4 offsets per job, and a census summary says per leg
          whether the answer VARIES WITH seam.time. Needs capture_requests on.
        type: string
        default: ''
      test_fault:
        description: >-
          TEST-ONLY, empty for every real sweep. The probe's fault injection SWEEP_INJECT_HANG=<page>:<step>[,…]
          (steps pageClose browserClose launch newPage boot leg; the shard-local page number); a `nobound;` prefix
          also runs the MUTANT (SWEEP_HANG_BOUND=off: no bound — the injected hang sits until the job timeout); a
          `nostagewrite;` prefix runs the staging MUTANT (SWEEP_STAGE_MUTANT=skip-write: requested, never written —
          a staging leg must end `stage-failed`).
        type: string
        default: ''

jobs:
  plan:
    name: Divergence sweep — plan (${{ inputs.shards }} shards)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      timeout: ${{ steps.plan.outputs.timeout }}
      legs: ${{ steps.plan.outputs.legs }}
      census: ${{ steps.plan.outputs.census }}
    steps:
      # ⛓ NOT the wasm: the leg list reads the committed rules and the map document. ⛔ But it DOES import
      # `frontend/modules/shared/` (the sphere log's forward simulator), a SUBMODULE — the first dispatch's plan
      # died on ERR_MODULE_NOT_FOUND `shared/ruleEngine.js` (run 37371799347). So that one submodule, initialised.
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Initialise the shared submodule (the leg list's imports)
        run: git submodule update --init frontend/modules/shared

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Derive the leg list and the partition
        id: plan
        env:
          SHARDS: ${{ inputs.shards }}
          IDS: ${{ inputs.ids }}
          KEYS: ${{ inputs.keys }}
          PAGE_LEGS: ${{ inputs.page_legs }}
          STAGE_FLAGS: ${{ inputs.stage_flags }}
          LEG_BUDGET: ${{ inputs.leg_budget_ms }}
          UPGRADE_WINDOW: ${{ inputs.upgrade_window_work }}
          DASH_ONLY: ${{ inputs.dash_only_window }}
          DASH_SHAPE: ${{ inputs.dash_shape }}
          CENSUS: ${{ inputs.seam_census }}
          CAPTURE: ${{ inputs.capture_requests && 'on' || '' }}
        run: |
          set -o pipefail
          if [ -n "$CENSUS" ] && [ -z "$CAPTURE" ]; then echo "::error::seam_census needs capture_requests on"; exit 1; fi
          mkdir -p test-results/divergence-sweep
          L=test-results/divergence-sweep/legs.jsonl
          node scripts/procgen/seedling-divergence-legs.mjs --out="$L" --presets=seedling_playthrough --blocks | tee plan.txt
          P=scripts/procgen/probe-seedling-divergence-sweep.mjs
          if [ -n "$IDS$KEYS" ]; then
            # ⛓ an id / key list is partitioned too (the subset, by the same price); `pickLegs` throws on an unknown key
            node --input-type=module -e "import fs from 'node:fs';import {pickLegs} from './scripts/procgen/seedling-divergence-legs.mjs';const legs=fs.readFileSync('$L','utf8').split('\n').filter(Boolean).map((l)=>JSON.parse(l));const pick=pickLegs(legs,{ids:(process.env.IDS||'').split(',').filter(Boolean).map(Number),keys:(process.env.KEYS||'').split('|').filter(Boolean)});console.log('SELECTED: '+pick.length+' leg(s)');fs.writeFileSync('$L.sub',pick.map((l)=>JSON.stringify(l)).join('\n')+'\n')"
            mv "$L.sub" "$L"
          fi
          node "$P" --legs="$L" --shard-plan="$SHARDS" --page-legs="$PAGE_LEGS" --stage-flags="$STAGE_FLAGS" ${LEG_BUDGET:+--leg-budget-ms="$LEG_BUDGET"} \
            ${UPGRADE_WINDOW:+--upgrade-window-work="$UPGRADE_WINDOW"} ${DASH_ONLY:+--dash-only-window="$DASH_ONLY"} \
            ${DASH_SHAPE:+--dash-shape="$DASH_SHAPE"} | tee -a plan.txt
          node "$P" --legs="$L" --shard-plan="$SHARDS" --page-legs="$PAGE_LEGS" --stage-flags="$STAGE_FLAGS" ${LEG_BUDGET:+--leg-budget-ms="$LEG_BUDGET"} \
            ${UPGRADE_WINDOW:+--upgrade-window-work="$UPGRADE_WINDOW"} ${DASH_ONLY:+--dash-only-window="$DASH_ONLY"} \
            ${DASH_SHAPE:+--dash-shape="$DASH_SHAPE"} --json > plan.json
          # ⛓ the partition travels with the leg list: the merge compares each shard's ids against its rows
          cp plan.json test-results/divergence-sweep/plan.json
          echo "matrix=$(node -p "JSON.stringify(require('./plan.json').matrix)")" >> "$GITHUB_OUTPUT"
          echo "timeout=$(node -p "require('./plan.json').timeoutMinutes")" >> "$GITHUB_OUTPUT"
          echo "legs=$(node -p "require('./plan.json').legs")" >> "$GITHUB_OUTPUT"
          # ⛓ SEAM TIME CENSUS — (leg, 4-offset chunk) per job; `parseSeamSweep` refuses a bad range by name.
          # ⛔ ASSIGNED first, then echoed: inside `echo "census=$(…)"` the refusal was swallowed (`-e` ignores a failed
          # substitution in an argument), the matrix came out empty, and no census job ran (run 38809315570, `true`).
          if [ -n "$CENSUS" ]; then
            C=$(node --input-type=module -e "import {parseSeamSweep} from './scripts/procgen/replay-seedling-solve-request.mjs';import fs from 'node:fs';const d=parseSeamSweep(process.env.CENSUS);const ids=JSON.parse(fs.readFileSync('plan.json','utf8')).shards.flatMap((s)=>s.ids);const out=[];for(const id of ids)for(let k=0;k<d.length;k+=4)out.push({id,from:d[k],to:d[Math.min(d.length,k+4)-1]});console.log(JSON.stringify(out))")
            echo "census=$C" >> "$GITHUB_OUTPUT"
          else
            echo "census=[]" >> "$GITHUB_OUTPUT"
          fi
          echo "MEASURED: legs sha256 $(sha256sum "$L" | cut -c1-16) at ${GITHUB_SHA}"
          { echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the leg list and the partition
        uses: actions/upload-artifact@v7.0.0
        with:
          name: divergence-legs
          path: |
            test-results/divergence-sweep/legs.jsonl
            test-results/divergence-sweep/plan.json
          retention-days: 90

  shard:
    name: Divergence sweep — shard ${{ matrix.shard }}/${{ inputs.shards }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    strategy:
      # ⛓ every shard reports; one red shard must not cancel the others' evidence.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve the pinned Playwright version (the cache key)
        id: pwver
        run: |
          V=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: pwcache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pwver.outputs.version }}

      - name: Install Chromium for Playwright
        timeout-minutes: 12
        run: node node_modules/playwright/cli.js install chromium

      - name: Download the leg list
        uses: actions/download-artifact@v8.0.1
        with:
          name: divergence-legs
          path: test-results/divergence-sweep

      - name: 'Run shard ${{ matrix.shard }}/${{ inputs.shards }} (${{ inputs.mode }}, ${{ inputs.producer }}, ${{ inputs.page }})'
        id: sweep
        env:
          SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
          I: ${{ matrix.shard }}
          MODE: ${{ inputs.mode }}
          PRODUCER: ${{ inputs.producer }}
          PAGE: ${{ inputs.page }}
          PAGE_LEGS: ${{ inputs.page_legs }}
          STAGE: ${{ !inputs.stage_events && '--no-stage-events' || '' }}
          CONTACT: ${{ inputs.contact_fidelity }}
          STAGE_FLAGS: ${{ inputs.stage_flags }}
          AXE_DODGE: ${{ inputs.axe_dodge }}
          UPGRADE_WINDOW: ${{ inputs.upgrade_window_work }}
          DASH_ONLY: ${{ inputs.dash_only_window }}
          DASH_SHAPE: ${{ inputs.dash_shape }}
          LEG_BUDGET: ${{ inputs.leg_budget_ms }}
          CAPTURE: ${{ inputs.capture_requests && 'on' || '' }}
          TEST_FAULT: ${{ inputs.test_fault }}
        run: |
          set -o pipefail
          # ⛔ TEST-ONLY (the `test_fault` input; empty = inert): the hang injection and the no-bound mutant
          if [ -n "$TEST_FAULT" ]; then
            TF="$TEST_FAULT"
            case "$TF" in nostagewrite\;*) export SWEEP_STAGE_MUTANT=skip-write; TF="${TF#nostagewrite;}";; esac
            case "$TF" in nobound\;*) export SWEEP_HANG_BOUND=off; TF="${TF#nobound;}";; esac
            [ -n "$TF" ] && export SWEEP_INJECT_HANG="$TF"
            echo "::warning::TEST-ONLY fault injection: SWEEP_INJECT_HANG=${SWEEP_INJECT_HANG:-} SWEEP_HANG_BOUND=${SWEEP_HANG_BOUND:-on} SWEEP_STAGE_MUTANT=${SWEEP_STAGE_MUTANT:-}"
          fi
          python3 -m http.server 8000 >/tmp/httpd.log 2>&1 &
          echo $! > /tmp/httpd.pid
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8000/frontend/index.html && break
            sleep 1
          done
          D=test-results/divergence-sweep
          L=$D/shard.log
          DUMP=""; [ "$I" = "1" ] && DUMP="--dump=$D/delivered-set.json"
          S=$(date +%s)
          set +e
          node scripts/procgen/probe-seedling-divergence-sweep.mjs --legs=$D/legs.jsonl --shard="$SHARD" --mode="$MODE" \
            --producer="$PRODUCER" --page="$PAGE" --page-legs="$PAGE_LEGS" --out=$D/rows-$I.jsonl $DUMP $STAGE ${CONTACT:+--contact-fidelity="$CONTACT"} \
            --stage-flags="$STAGE_FLAGS" ${AXE_DODGE:+--axe-dodge="$AXE_DODGE"} ${LEG_BUDGET:+--leg-budget-ms="$LEG_BUDGET"} \
            ${UPGRADE_WINDOW:+--upgrade-window-work="$UPGRADE_WINDOW"} ${DASH_ONLY:+--dash-only-window="$DASH_ONLY"} \
            ${DASH_SHAPE:+--dash-shape="$DASH_SHAPE"} ${CAPTURE:+--capture-requests=$D/requests-$I.jsonl} 2>&1 | tee "$L"
          RC=$?
          set -e
          echo "MEASURED: shard $SHARD rc=$RC wall $(( $(date +%s) - S ))s load $(cut -d' ' -f1-3 /proc/loadavg) nproc $(nproc) at ${GITHUB_SHA}"
          kill "$(cat /tmp/httpd.pid)" 2>/dev/null || true
          # ⛔ THE CHANNEL, ASSERTED (an empty shard boots no page)
          if ! grep -aq "^SHARD $SHARD: 0 legs" "$L" && ! grep -aq '^CHANNEL: headless logic-only' "$L"; then
            echo "::error::shard $SHARD printed no 'CHANNEL: headless logic-only' line"
            exit 1
          fi
          exit $RC

      - name: Summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
          I: ${{ matrix.shard }}
        run: |
          D=test-results/divergence-sweep
          {
            echo "## Divergence sweep — shard ${SHARD} — \`${{ steps.sweep.outcome }}\`"
            echo '```'
            grep -aE '^SHARD |^CHANNEL:|^LEG-BUDGET:|^INFO: page|^FAIL|^HANG:' "$D/shard.log" 2>/dev/null | cut -c1-300 || true
            echo "rows $(wc -l < "$D/rows-$I.jsonl" 2>/dev/null || echo 0)"
            node -e "const fs=require('fs');const m={};for(const l of fs.readFileSync('$D/rows-$I.jsonl','utf8').split('\n').filter(Boolean)){const e=JSON.parse(l).end;m[e]=(m[e]||0)+1}console.log(JSON.stringify(m))" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the shard's rows and log
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: divergence-shard-${{ matrix.shard }}
          path: test-results/divergence-sweep/
          retention-days: 90

  merge:
    name: Divergence sweep — merge (${{ inputs.shards }} shards)
    needs: [plan, shard]
    # ⛓ ALWAYS, so a failed or missing shard is NAMED here.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ⛓ the verdict module and the hit-tick census it imports (both pure node, no npm)
      - name: Checkout the merge verdict
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: |
            scripts/procgen/seedlingDivergenceMerge.js
            scripts/procgen/seedlingHitTicks.js
          sparse-checkout-cone-mode: false

      - name: Download the partition
        uses: actions/download-artifact@v8.0.1
        with:
          name: divergence-legs
          path: plan

      - name: Download every shard's rows
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: divergence-shard-*
          path: shards

      - name: Concatenate, and count the legs against the plan
        env:
          LEGS: ${{ needs.plan.outputs.legs }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          SHARDS: ${{ inputs.shards }}
        run: |
          mkdir -p merged
          : > merged/rows.jsonl
          for i in $(node -p "JSON.parse(process.env.MATRIX).join(' ')"); do
            F="shards/divergence-shard-$i/rows-$i.jsonl"
            # ⛓ a pattern that matches ONE artifact is extracted straight into `shards/`, no per-artifact folder
            # (measured: run 37379605352, shards=1, merged 0 rows of 3)
            [ -f "$F" ] || F="shards/rows-$i.jsonl"
            echo "SHARD $i/$SHARDS: $(wc -l < "$F" 2>/dev/null || echo 'NO ROWS') row(s); $(grep -aE '^INFO: page .* booted' "$(dirname "$F")/shard.log" 2>/dev/null | wc -l) page(s) booted"
            [ -f "$F" ] && cat "$F" >> merged/rows.jsonl
          done
          cp shards/divergence-shard-1/delivered-set.json merged/ 2>/dev/null || cp shards/delivered-set.json merged/ 2>/dev/null || true
          LOGS=$(ls shards/*/shard.log shards/shard.log 2>/dev/null || true)
          set +e
          # shellcheck disable=SC2086
          node scripts/procgen/seedlingDivergenceMerge.js merged/rows.jsonl plan/plan.json $LOGS | tee merged/summary.txt
          set -e
          W=$(grep -c '^MERGE-WARN' merged/summary.txt || true)
          if [ "$W" -gt 0 ]; then echo "::warning::$W harness hang(s) after every leg of their page had reported (see the summary)"; fi
          { echo '```'; cat merged/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^MERGE-FAIL' merged/summary.txt; then
            echo "::error::$(grep '^MERGE-FAIL' merged/summary.txt | head -1)"
            exit 1
          fi

      - name: Upload the merged rows
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: divergence-merged
          path: |
            merged/
            shards/*/shard.log
          retention-days: 90

  # ⛓ SEAM TIME CENSUS (input `seam_census`, off by default) — a leg's first captured request re-solved in node at each
  # arrival game clock (leg 397: six first requests differed ONLY in staging.seam.time, and each replays to one answer).
  # A 640-unit cut costs ~10 min of one core, so the offsets fan out, 4 replays per job at once.
  census:
    name: Divergence sweep — seam-time census leg ${{ matrix.c.id }} ${{ matrix.c.from }}..${{ matrix.c.to }}
    needs: [plan, shard]
    if: always() && inputs.seam_census != '' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        c: ${{ fromJSON(needs.plan.outputs.census) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Initialise the shared submodule
        run: git submodule update --init frontend/modules/shared

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download the captured requests
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: divergence-shard-*
          path: captured

      - name: Replay at each seam time
        env:
          ID: ${{ matrix.c.id }}
          FROM: ${{ matrix.c.from }}
          TO: ${{ matrix.c.to }}
        run: |
          set -o pipefail
          F=$(grep -l "\"id\":$ID," $(find captured -name 'requests-*.jsonl') | head -1)
          [ -n "$F" ] || { echo "::error::no captured request for leg $ID"; exit 1; }
          mkdir -p census
          node scripts/procgen/replay-seedling-solve-request.mjs --requests="$F" --id="$ID" --i=0 --seam-time-sweep="$FROM..$TO" \
            --jobs=4 --out="census/census-$ID-$FROM.jsonl" | grep -v '^ROW '

      - name: Upload the census rows
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: divergence-census-${{ matrix.c.id }}-${{ matrix.c.from }}
          path: census/
          retention-days: 90

  census-summary:
    name: Divergence sweep — seam-time census summary
    needs: census
    if: always() && inputs.seam_census != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: scripts/procgen

      - name: Download the census rows
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: divergence-census-*
          path: census
          merge-multiple: true

      - name: Summarize
        run: |
          node scripts/procgen/replay-seedling-solve-request.mjs --summarize=census | tee census/summary.txt
          { echo '```'; cat census/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the summary
        uses: actions/upload-artifact@v7.0.0
        with:
          name: divergence-census-summary
          path: census/
          retention-days: 90
