name: Generate UT Sphere Logs

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed to use for generation'
        type: number
        default: 1

      branch_name:
        description: 'Branch name to save results to'
        type: string
        default: 'generated-sphere-logs-ut'

permissions:
  contents: write  # Allow pushing commits and creating branches

jobs:
  generate-sphere-logs:
    name: Generate UT Sphere Logs
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour timeout for full generation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '~3.12.7'
          check-latest: true

      - name: Create or switch to target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin

          BRANCH_NAME="${{ inputs.branch_name }}"

          if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
            git checkout "$BRANCH_NAME"
            git pull origin "$BRANCH_NAME"
            git rm -rf .
            git checkout origin/main -- .
            if ! git diff --staged --quiet; then
              git commit -m "Sync $BRANCH_NAME with main"
              git push origin "$BRANCH_NAME"
            fi
          else
            git checkout -b "$BRANCH_NAME" origin/main
            git push -u origin "$BRANCH_NAME"
          fi

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt -y install python3-gi libgirepository1.0-dev

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python ModuleUpdate.py --yes

      - name: Generate template files
        run: |
          source .venv/bin/activate
          python -c "from Options import generate_yaml_templates; generate_yaml_templates('Players/Templates')"

      - name: Configure host settings
        run: |
          source .venv/bin/activate
          python Launcher.py --update_settings
          python scripts/setup/update_host_settings.py minimal-spoilers

      - name: Install Node.js dependencies
        run: npm install

      - name: Start HTTP server
        run: |
          python -m http.server 8000 &
          sleep 2

      - name: Run UT comparison tests with fixed seed
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          source .venv/bin/activate
          echo "Using fixed seed: ${{ inputs.seed }}"

          # Run the UT comparison test for all templates
          # This generates both sphere_log.jsonl (from Python) and sphere_log_ut.jsonl (from Universal Tracker)
          python scripts/test/test-all-ut-comparison.py \
            --seed ${{ inputs.seed }} \
            --runs-per-template 1 \
            --skip-chart

      - name: List generated sphere log files
        run: |
          echo "=== Generated sphere_log.jsonl files ==="
          find frontend/presets -name "AP_*_sphere_log.jsonl" -type f | wc -l
          find frontend/presets -name "AP_*_sphere_log.jsonl" -type f | head -20

          echo ""
          echo "=== Generated sphere_log_ut.jsonl files ==="
          find frontend/presets -name "AP_*_sphere_log_ut.jsonl" -type f | wc -l
          find frontend/presets -name "AP_*_sphere_log_ut.jsonl" -type f | head -20

      - name: Commit and push generated sphere logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="${{ inputs.branch_name }}"
          git pull origin "$BRANCH_NAME" || true

          # Add all sphere log files
          echo "Adding sphere log files..."
          find frontend/presets -name "AP_*_sphere_log.jsonl" -type f -exec git add -f {} \;
          find frontend/presets -name "AP_*_sphere_log_ut.jsonl" -type f -exec git add -f {} \;

          # Also add the test results JSON
          git add -f scripts/output/ut-comparison/test-results-fixed-seed.json || true

          # Show what will be committed
          echo "=== Staged files ==="
          git diff --staged --name-only | head -30
          echo "..."
          echo "Total staged files: $(git diff --staged --name-only | wc -l)"

          if ! git diff --staged --quiet; then
            git commit -m "Generate UT sphere logs (seed=${{ inputs.seed }})

            Generated by workflow run: ${{ github.run_id }}
            Seed: ${{ inputs.seed }}

            Includes:
            - Python sphere logs (sphere_log.jsonl)
            - Universal Tracker sphere logs (sphere_log_ut.jsonl)
            - Test results JSON
            "
            git push origin "$BRANCH_NAME"
            echo "Successfully pushed sphere logs to $BRANCH_NAME"
          else
            echo "No sphere log files to commit"
          fi
