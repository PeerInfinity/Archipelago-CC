        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Create virtual environment and install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ModuleUpdate
        run: |
          source .venv/bin/activate
          python ModuleUpdate.py --yes

      - name: Generate template files
        run: |
          source .venv/bin/activate
          python -c "from Options import generate_yaml_templates; generate_yaml_templates('Players/Templates')"

      - name: Generate multitemplate configurations
        run: |
          source .venv/bin/activate
          python scripts/build/generate-multitemplate-configs.py

      - name: Configure host settings
        run: |
          source .venv/bin/activate
          python Launcher.py --update_settings
          python scripts/setup/update_host_settings.py full-spoilers

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        id: cache-node
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Node.js dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: |
          source .venv/bin/activate
          npx playwright install chromium

      - name: Start HTTP server
        run: |
          python -m http.server 8000 &
          sleep 2

      - name: Run full multitemplate test
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          source .venv/bin/activate
          python scripts/test/test-all-templates.py \
            --templates-dir Players/presets/multitemplate/alttp \
            --multitemplate \
            --every-nth ${{ matrix.split_total }} \
            --skip-first $((${{ matrix.split_num }} - 1)) \
            --output-file scripts/output/multitemplate-full/test-results-split-${{ matrix.split_num }}.json \
            --no-backup \
            -p

      - name: Upload test results for split ${{ matrix.split_num }}
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-full-multitemplate-split-${{ matrix.split_num }}
          path: scripts/output/multitemplate-full/test-results-split-${{ matrix.split_num }}.json
          retention-days: 7

  # Combine full multitemplate results - DISABLED
  combine-full-multitemplate:
    name: Combine Full Multitemplate Results
    runs-on: ubuntu-latest
    needs: test-full-multitemplate
    # Multitemplate tests are disabled - uncomment the line below and remove 'if: false' to re-enable
    # if: ${{ !cancelled() && (inputs.multitemplate_tests == 'full-only' || inputs.multitemplate_tests == 'both') }}
    if: false

    steps:
      - name: Checkout test-results-update branch
        uses: actions/checkout@v4
        with:
          ref: test-results-update

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '~3.12.7'
          check-latest: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine test results
        run: |
          mkdir -p /tmp/merged-results/scripts/output/multitemplate-full
          python scripts/test/combine-test-results.py \
            --input-files artifacts/test-results-full-multitemplate-split-*/test-results-split-*.json \
            --output-file /tmp/merged-results/scripts/output/multitemplate-full/test-results.json

      - name: Copy results and generate documentation
        run: |
          mkdir -p scripts/output/multitemplate-full
          cp /tmp/merged-results/scripts/output/multitemplate-full/test-results.json \
             scripts/output/multitemplate-full/test-results.json
          python scripts/docs/generate-test-chart.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scripts/output/multitemplate-full/test-results.json
          git add docs/json/developer/test-results/*.md || true

          if ! git diff --staged --quiet; then
            git commit -m "Update full multitemplate test results (sequential workflow)

            Generated by workflow run: ${{ github.run_id }}
            "
            git push origin test-results-update
          fi
