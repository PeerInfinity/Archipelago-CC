          WORLDGEN2_FLAG: ${{ inputs.enable_worldgen2_tests && '--include-worldgen2' || '' }}
        run: |
          source .venv/bin/activate
          python scripts/test/test-all-templates.py \
            --seed ${{ inputs.start_seed }} \
            --every-nth ${{ matrix.split_total }} \
            --skip-first $((${{ matrix.split_num }} - 1)) \
            --output-file scripts/output/${OUTPUT_DIR}/test-results-split-${{ matrix.split_num }}.json \
