          mkdir -p scripts/output/multiclient
          cp /tmp/merged-results/scripts/output/multiclient/test-results.json \
             scripts/output/multiclient/test-results.json
          python scripts/docs/generate-test-chart.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scripts/output/multiclient/test-results.json
          git add docs/json/developer/test-results/*.md || true

          if ! git diff --staged --quiet; then
            git commit -m "Update multiclient test results (sequential workflow)

            Generated by workflow run: ${{ github.run_id }}
            "
            git push origin test-results-update
          fi

  # Multiworld Test (single job version)
  test-multiworld-single:
    name: Test Multiworld (Single Job)
    runs-on: ubuntu-latest
    needs: [setup-branch, combine-multiclient]
    if: !cancelled() && inputs.enable_multiworld && inputs.multiworld_parallelization == 'single-job' && (needs.setup-branch.result == 'success')
    timeout-minutes: 180

    steps:
      - name: Checkout test-results-update branch
        uses: actions/checkout@v4
        with:
          ref: test-results-update

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '~3.12.7'
          check-latest: true

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt -y install python3-gi libgirepository1.0-dev

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python ModuleUpdate.py --yes

      - name: Generate template files
        run: |
          source .venv/bin/activate
          python -c "from Options import generate_yaml_templates; generate_yaml_templates('Players/Templates')"

      - name: Configure host settings
        run: |
          source .venv/bin/activate
          python Launcher.py --update_settings
          python scripts/setup/update_host_settings.py minimal-spoilers

      - name: Install Node.js dependencies
        run: npm install

      - name: Install Playwright browsers
        run: |
          source .venv/bin/activate
          npx playwright install chromium

      - name: Start HTTP server
        run: |
          python -m http.server 8000 &
          sleep 2

      - name: Run multiworld test
        run: |
          source .venv/bin/activate
          python scripts/test/test-all-templates.py \
            --multiworld \
            --output-file scripts/output/multiworld/test-results.json \
            --no-backup \
            -p

      - name: Upload test results
        if: !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-multiworld-single
          path: scripts/output/multiworld/test-results.json
          retention-days: 7

  # Combine multiworld results (single job version)
  combine-multiworld-single:
    name: Combine Multiworld Results (Single Job)
    runs-on: ubuntu-latest
    needs: test-multiworld-single
    if: !cancelled() && inputs.enable_multiworld && inputs.multiworld_parallelization == 'single-job'

    steps:
      - name: Checkout test-results-update branch
        uses: actions/checkout@v4
        with:
          ref: test-results-update

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '~3.12.7'
          check-latest: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results-multiworld-single
          path: artifacts

      - name: Copy results and generate documentation
        run: |
