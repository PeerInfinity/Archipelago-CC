name: JavaScript Unit Tests

on:
  push:
    paths:
      - 'frontend/**/*.js'
      - 'frontend/**/*.test.js'
      - 'vitest.config.js'
      - 'vitest.slow.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/unittests_frontend.yml'
  pull_request:
    paths:
      - 'frontend/**/*.js'
      - 'frontend/**/*.test.js'
      - 'vitest.config.js'
      - 'vitest.slow.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/unittests_frontend.yml'
  workflow_dispatch:

jobs:
  javascript-tests:
    name: JavaScript Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npm run test:unit

      # Heavy generate-and-test suites (*.slow.test.js), run serially so they
      # don't flake under parallel CPU contention. See vitest.slow.config.js.
      - name: Run slow Vitest tests
        run: npm run test:unit:slow
