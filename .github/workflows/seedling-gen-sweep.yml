name: Seedling generator sweep (manual)

# ⛓ THE GENERATOR'S YIELD/COST SWEEP, ON RUNNERS (slice `seedling-gen-ropegate`, the rope gate's cost row).
# `sweep-yield-table.mjs --substrate=seedling` generates one level per (kind, size, seed) cell, each in its own child
# process under a per-cell wall budget, and prints the yield table plus a JSON of every cell (REVERT reasons, the
# worst solve, the element census, the certification's verbs). ⚖ USER (2026-09-29 / 10-06): CPU-heavy work runs in CI
# or cloud sessions, never on the shared box. ⇒ `workflow_dispatch:` and a `seedling-gen-sweep/**` push-ref trigger
# (a branch can run it before main has this file), and NOTHING ELSE — never push to main/PRs, never a schedule.
#
#   cell    one matrix job per (element arm, skeleton kind): the sweep itself, unchanged, `--kinds=<kind>`
#           `--elements=<arm>`, every size and seed. Each job uploads its table and JSON.
#   summary one table per arm: cells, placed, certified, certified with `pull` in the plan, REVERTs (pass-2
#           candidates the oracle reverted), the worst single solve and the worst cell, and the harness aborts.
#
# ⚠ THE WALL-CLOCK COLUMNS ARE EVIDENCE ONLY (the sweep's own law): they decide nothing about a level, and a runner's
# CPUs are not the box's.
#
# Dispatch (once this file is on the default branch; before that, push a `seedling-gen-sweep/<name>` ref, which runs
# the DEFAULTS below):
#   gh workflow run seedling-gen-sweep.yml -R PeerInfinity/Archipelago-CC --ref <branch> \
#     -f arms='ropegate,none' -f seeds=1-12 -f sizes=10x10,14x14

on:
  workflow_dispatch:
    inputs:
      arms:
        description: Comma-separated `--elements=` specs, one arm each (a `+` list is one arm).
        type: string
        default: ropegate,none
      kinds:
        description: Comma-separated skeleton kinds (empty = every kind the Seedling binding offers).
        type: string
        default: ''
      palette:
        description: The biome palette (`--palette=`).
        type: string
        default: post-sword
      seeds:
        description: Seeds (`1-12` or `1,3,5`).
        type: string
        default: 1-12
      sizes:
        description: Room sizes (`10x10,14x14`).
        type: string
        default: 10x10,14x14
      cellbudget:
        description: The harness's per-cell wall budget, seconds.
        type: number
        default: 600
  push:
    branches:
      - 'seedling-gen-sweep/**'

env:
  DEFAULT_ARMS: ropegate,none
  DEFAULT_PALETTE: post-sword
  DEFAULT_SEEDS: 1-12
  DEFAULT_SIZES: 10x10,14x14
  DEFAULT_CELLBUDGET: '600'

jobs:
  plan:
    name: Generator sweep — plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Init the shared submodule (the kind list is read off the binding, which imports it)
        run: git submodule update --init frontend/modules/shared

      - name: Resolve the (arm, kind) matrix
        id: plan
        env:
          ARMS: ${{ inputs.arms }}
          KINDS: ${{ inputs.kinds }}
        run: |
          set -euo pipefail
          M=$(node --input-type=module -e '
            const { SEEDLING_SKELETON_KINDS } = await import("./frontend/modules/seedlingDemo/procgenSeedling.js");
            const arms = process.argv[1].split(",").map((s) => s.trim()).filter(Boolean);
            const kinds = process.argv[2] ? process.argv[2].split(",").map((s) => s.trim()).filter(Boolean)
              : [...SEEDLING_SKELETON_KINDS];
            if (!arms.length || !kinds.length) { console.error("refused: an empty arm or kind list"); process.exit(1); }
            const out = [];
            for (const arm of arms) for (const kind of kinds) {
              out.push({ id: `${arm.replace(/[^a-z0-9]+/gi, "_")}-${kind.replace(/[^a-z0-9]+/gi, "_")}`, arm, kind });
            }
            console.log(JSON.stringify(out));
          ' "${ARMS:-$DEFAULT_ARMS}" "${KINDS:-}")
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          node -e 'for (const e of JSON.parse(process.argv[1])) console.log(`${e.id}: --elements=${e.arm} --kinds=${e.kind}`)' "$M"

  cell:
    name: ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: false

      - name: Init the shared submodule (the sweep imports frontend/modules/shared)
        run: git submodule update --init frontend/modules/shared

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sweep --elements=${{ matrix.arm }} --kinds=${{ matrix.kind }}
        env:
          ID: ${{ matrix.id }}
          ARM: ${{ matrix.arm }}
          KIND: ${{ matrix.kind }}
          PALETTE: ${{ inputs.palette }}
          SEEDS: ${{ inputs.seeds }}
          SIZES: ${{ inputs.sizes }}
          CELLBUDGET: ${{ inputs.cellbudget }}
        run: |
          set -o pipefail
          mkdir -p test-results/seedling-gen-sweep
          S=$(date +%s)
          node scripts/procgen/sweep-yield-table.mjs --substrate=seedling \
            --palette="${PALETTE:-$DEFAULT_PALETTE}" --elements="$ARM" --kinds="$KIND" \
            --seeds="${SEEDS:-$DEFAULT_SEEDS}" --sizes="${SIZES:-$DEFAULT_SIZES}" \
            --cellbudget="${CELLBUDGET:-$DEFAULT_CELLBUDGET}" \
            --json="test-results/seedling-gen-sweep/${ID}.json" \
            2>"test-results/seedling-gen-sweep/${ID}.err" | tee "test-results/seedling-gen-sweep/${ID}.md"
          echo "MEASURED: --elements=$ARM --kinds=$KIND wall $(( $(date +%s) - S ))s nproc $(nproc) at ${GITHUB_SHA}" \
            | tee -a "test-results/seedling-gen-sweep/${ID}.md"

      - name: Upload the cell's table and JSON
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ matrix.id }}-sweep
          path: test-results/seedling-gen-sweep/
          retention-days: 90

  summary:
    name: Generator sweep — summary
    needs: [plan, cell]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect every cell's JSON
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: '*-sweep'
          path: sweep
          merge-multiple: true

      - name: One table per arm
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("sweep").filter((f) => f.endsWith(".json"));
            const arms = new Map();
            for (const f of files) {
              const d = JSON.parse(fs.readFileSync(`sweep/${f}`, "utf8"));
              for (const r of d.results ?? []) {
                const arm = r.elements?.head ?? "(none)";
                const key = f.replace(/-[^-]+\.json$/, "");
                if (!arms.has(key)) arms.set(key, []);
                arms.get(key).push(r);
              }
            }
            const lines = [`SEEDLING GENERATOR SWEEP @ ${process.env.GITHUB_SHA}`];
            lines.push("| arm | kind x size | cells | aborted | placed | certified | certified with pull | REVERTs | worst solve ms | worst cell ms |");
            lines.push("|---|---|---|---|---|---|---|---|---|---|");
            const sumRow = (arm, label, rs) => {
              const ok = rs.filter((r) => r.stop);
              const reverts = ok.reduce((n, r) => n + Object.values(r.byTemplate ?? {})
                .reduce((m, t) => m + (t.REVERTED ?? 0), 0), 0);
              const placed = rs.filter((r) => r.elements?.placed).length;
              const cert = rs.filter((r) => r.elements?.certified).length;
              const pull = rs.filter((r) => r.elements?.certified && (r.elements.certVerbs ?? []).includes("pull")).length;
              const worst = Math.max(0, ...ok.map((r) => r.maxSolveMs ?? 0));
              const cell = Math.max(0, ...ok.map((r) => r.genMs ?? 0));
              lines.push(`| ${arm} | ${label} | ${rs.length} | ${rs.length - ok.length} | ${placed} | ${cert} | ${pull} | ${reverts} | ${worst} | ${cell} |`);
            };
            for (const [arm, rs] of [...arms].sort()) {
              const by = new Map();
              for (const r of rs) {
                const k = `${r.kind} ${r.size}`;
                if (!by.has(k)) by.set(k, []);
                by.get(k).push(r);
              }
              for (const [k, v] of [...by].sort()) sumRow(arm, k, v);
              sumRow(arm, "**ALL**", rs);
            }
            const out = lines.join("\n");
            console.log(out);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
          '
