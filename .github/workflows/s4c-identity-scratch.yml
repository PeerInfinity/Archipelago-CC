# ⛔⛔ SCRATCH — S4c STEP 1, A MEASUREMENT WITH AN ABORT CRITERION.
#
# ⚖ 72 (b) requires three consecutive CI runs in which a row reads `same`
# before it may be quoted from CI. The prerequisite nobody has ever tested is
# ONE run: a gate verdict (`265/0`) is portable by construction, but an **md5
# over generated levels is portable only if generation is fully deterministic
# ACROSS ENVIRONMENTS**. If a runner's digest differs from the box's, no
# identity row can ever meet the bar and every line of S4c's plumbing would be
# waste.
#
# ⇒ this workflow runs the SIX candidate rows once, on `workflow_dispatch`, and
# prints each one's CI value beside its banked one. It is DELETED in the same
# slice; nothing reads it, nothing depends on it, and it is not on any push
# trigger.
#
# ⛔ THE SIX ARE DERIVED, NEVER TYPED — non-cheap `kind: 'identity'` standing
# rows, minus the ones ⚖ 72 (a) keeps on the box (a row whose script takes the
# box lock with `kind: 'windows'`). `roster: --win --tier=full` is not in the
# population at all: `standingRows()` does not derive it (⚖ 70's composite,
# `alwaysQuoted`, no command).
name: S4c scratch — are the identity digests portable?

on:
  workflow_dispatch:

jobs:
  identity-rows:
    name: The six candidate identity/producer rows, on a runner
    runs-on: ubuntu-latest
    # ⛓ 18.2 banked box-minutes. The runner is 0.18×–0.96× the box on the
    # browser arms (S5b), so this is a KILL DEADLINE well above where it lands,
    # not a prediction.
    timeout-minutes: 60
    steps:
      # ⛓ RECURSIVE — `plan-seedling-r7-ends-meet --check` drives the wasm
      # build out of `frontend/modules/flashPanel/wasm`. Without it that row
      # takes the artifact guard's `SKIP` path, whose stdout is a different
      # md5 for a reason that has nothing to do with portability.
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve the pinned Playwright version (the cache key)
        id: pwver
        run: |
          V=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "MEASURED: playwright pin $V"

      - name: Cache the Playwright browser
        id: pwcache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pwver.outputs.version }}

      - name: Install Chromium for Playwright
        timeout-minutes: 12
        run: |
          node node_modules/playwright/cli.js install chromium
          echo "MEASURED-CACHE: cache-hit=${{ steps.pwcache.outputs.cache-hit }}"

      - name: Run the six rows and compare each to the bank
        timeout-minutes: 50
        run: |
          set -o pipefail
          python3 -m http.server 8000 >/tmp/httpd.log 2>&1 &
          echo $! > /tmp/httpd.pid
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8000/frontend/index.html && break
            sleep 1
          done
          echo "MEASURED: node $(node -v) · python3 $(python3 -V 2>&1)"
          cat > s4c-scratch.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { REPO } from './scripts/procgen/gateRoster.js';
          import { readStandingValues, runRow, standingRows }
              from './scripts/procgen/standingValues.js';

          const bank = readStandingValues({});
          /** ⛔ derived: non-cheap identity rows, minus the box-locked-to-Windows one. */
          const windowsLocked = (row) => {
              const s = (/scripts\/procgen\/[A-Za-z0-9._-]+/.exec(row.command) ?? [])[0];
              if (!s) return false;
              try { return /kind:\s*'windows'/.test(readFileSync(join(REPO, s), 'utf8')); }
              catch { return false; }
          };
          const rows = standingRows({}).filter((r) => r.kind === 'identity'
              && bank.rows[r.key]?.cheap === false && !windowsLocked(r));
          console.log(`## S4C — ${rows.length} candidate row(s) at this head\n`);
          let same = 0;
          let moved = 0;
          for (const row of rows) {
              const r = await runRow(row, { repo: REPO });
              const banked = bank.rows[row.key]?.value ?? null;
              const verdict = r.value === banked ? 'same' : 'MOVED';
              if (verdict === 'same') same += 1; else moved += 1;
              console.log(`## S4C | ${row.key} | ${r.value} | exit=${r.exit} `
                  + `| banked=${banked} | ${verdict} | here=${(r.ms / 1000).toFixed(1)}s`);
          }
          console.log(`\n${same} same, ${moved} MOVED of ${rows.length}`);
          console.log(moved === 0
              ? 'ALL SIX AGREE — the digests are portable; S4c may build.'
              : `${moved} ROW(S) DISAGREE — the digests are NOT portable; S4c ABORTS.`);
          EOF
          set +e
          node s4c-scratch.mjs 2>&1 | tee /tmp/s4c.log
          RC=$?
          set -e
          kill "$(cat /tmp/httpd.pid)" 2>/dev/null || true
          exit $RC

      - name: Summary
        if: always()
        run: |
          {
            echo "## S4c step 1 — identity digest portability"
            echo ""
            echo '```'
            grep -E '^## S4C \||^[0-9]+ same,|AGREE|DISAGREE' /tmp/s4c.log 2>/dev/null \
              || echo '(the step produced no S4C lines)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
