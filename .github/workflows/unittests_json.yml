name: JavaScript Unit Tests

on:
  push:
    paths:
      - 'frontend/**/*.js'
      - 'frontend/**/*.test.js'
      - 'vitest.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/unittests_json.yml'
  pull_request:
    paths:
      - 'frontend/**/*.js'
      - 'frontend/**/*.test.js'
      - 'vitest.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/unittests_json.yml'
  workflow_dispatch:

jobs:
  javascript-tests:
    name: JavaScript Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npm run test:unit
