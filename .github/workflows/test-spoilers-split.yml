          python scripts/test/combine-test-results.py \
            --input-files artifacts/test-results-multitemplate-${{ matrix.spoiler_type }}-split-*/test-results-split-*.json \
            --output-file /tmp/merged-results/scripts/output/multitemplate-${{ matrix.spoiler_type }}/test-results.json

          # List what was created
          echo "=== Combined Results ==="
          ls -lh /tmp/merged-results/scripts/output/multitemplate-${{ matrix.spoiler_type }}/test-results.json

      - name: Create or switch to test-results-update branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch all branches
          git fetch origin

          # Check if branch exists remotely
          if git ls-remote --exit-code --heads origin test-results-update; then
            echo "Branch test-results-update exists, syncing with main"
            git checkout test-results-update
            git pull origin test-results-update

            # Make test-results-update's content match main exactly while preserving history
            echo "Syncing test-results-update to match main exactly..."

            # Remove all tracked files
            git rm -rf .

            # Restore all files from main
            git checkout origin/main -- .

            # Commit the sync if there are changes
            if ! git diff --staged --quiet; then
              git commit -m "Sync test-results-update with main before updating test results"
            else
              echo "Already in sync with main"
            fi
          else
            echo "Creating new branch test-results-update from main"
            git checkout -b test-results-update origin/main
          fi

      - name: Generate test charts and copy results
        run: |
          # Copy combined results to repository location so generate-test-chart.py can find them
          mkdir -p scripts/output/multitemplate-${{ matrix.spoiler_type }}
          cp /tmp/merged-results/scripts/output/multitemplate-${{ matrix.spoiler_type }}/test-results.json \
             scripts/output/multitemplate-${{ matrix.spoiler_type }}/test-results.json

          # Generate test charts and documentation
          python scripts/docs/generate-test-chart.py

          echo "=== Generated Documentation ==="
          ls -lh docs/json/developer/test-results/

          echo "=== Files ready for commit ==="
          ls -lh scripts/output/multitemplate-${{ matrix.spoiler_type }}/test-results.json
          ls -lh docs/json/developer/test-results/*.md 2>/dev/null || echo "No markdown files"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add the specific files we want to commit
          # Use -f because scripts/output is in .gitignore (even though specific files are excepted)
          git add -f scripts/output/multitemplate-${{ matrix.spoiler_type }}/test-results.json
          git add docs/json/developer/test-results/*.md || true

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update multitemplate ${{ matrix.spoiler_type }} test results (split by templates)

            Generated by workflow run: ${{ github.run_id }}
            Triggered by: ${{ github.actor }}

            Test results from parallel template testing:
            - Templates split across 10 parallel jobs
            - Spoiler type: ${{ matrix.spoiler_type }}
            - Includes generated test documentation
            "

            git push origin test-results-update

            echo "✅ Test results committed to test-results-update branch"
            echo "View the branch at: ${{ github.server_url }}/${{ github.repository }}/tree/test-results-update"
          fi
