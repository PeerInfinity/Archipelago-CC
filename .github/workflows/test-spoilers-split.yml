          # Generate test charts and documentation
          python scripts/docs/generate-test-chart.py

          echo "=== Generated Documentation ==="
          ls -lh docs/json/developer/test-results/

          echo "=== Files ready for commit ==="
          ls -lh scripts/output/spoiler-${{ matrix.spoiler_type }}/test-results.json
