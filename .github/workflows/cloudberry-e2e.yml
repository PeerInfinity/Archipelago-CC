name: Cloudberry end-to-end

# The Cloudberry substrate's two end-to-end gates, which need what no other job has together:
# Python (world_generator + Generate.py), the Cloudberry game page served SAME-ORIGIN (the live
# site, downloaded at test time — ⚖ R18: nothing of Cloudberry is committed here), headless
# Chromium with WebGL, and a dev server.
#
#   check-cloudberry-sphere.mjs  a sphere world GENERATED by the game's own generator (twice: the
#                                same bytes), a mixed maze + cloudberry world, Generate.py, played to
#                                Victory; then --check against the committed cloudberry_sphere_worldgen and
#                                (P4a) cloudberry_maze_mix_worldgen; (P5a) --double-jump: the Double Jump world
#                                (a Double-hero level behind the Double Jump gate), played, and --check against
#                                the committed cloudberry_double_jump_worldgen; (P5b) --physics: the hero physics
#                                world (world physics + per-region variation), played, and --check against the
#                                committed cloudberry_hero_physics_worldgen
#   check-cloudberry-embed.mjs   the demo region-library pack in a spiral world, played; then a
#                                sphere world from the same pack, played to Victory by the Playback Bot
#   the `cloudberry` in-app batch (P3a): the substrate's in-app rows (P3b: + its loop-mode rows; P4a: + the mixed-world loop
#                                row) and its tutorial walks (P4a: + the loop-mode one), which
#                                play the same same-origin copy (testBatches.js: manual, so no
#                                on-push job runs it — its rows refuse by name without the site)
#
# Runs only when a Cloudberry file changes (plus by hand), so it costs no slot on other pushes.
# ⚠ The live site moves when the Cloudberry repo deploys: a red here right after a Cloudberry
#   deploy is the generator having changed (the committed hashes), not this repository.

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/modules/cloudberryDemo/**'
      - 'frontend/modules/flashSubstrate/bridge.js'
      - 'frontend/region-libraries/demo-cloudberry-pack.json'
      - 'frontend/presets/cloudberry_sphere_worldgen/**'
      - 'worlds/cloudberry_sphere_worldgen/**'
      - 'frontend/presets/cloudberry_maze_mix_worldgen/**'
      - 'worlds/cloudberry_maze_mix_worldgen/**'
      - 'frontend/presets/cloudberry_double_jump_worldgen/**'
      - 'worlds/cloudberry_double_jump_worldgen/**'
      - 'frontend/presets/cloudberry_hero_physics_worldgen/**'
      - 'worlds/cloudberry_hero_physics_worldgen/**'
      - 'scripts/procgen/*cloudberry*'
      - 'scripts/setup/fetch-cloudberry-site.mjs'
      - 'frontend/modules/tests/testCases/cloudberrySubstrateTests.js'
      - 'frontend/modules/tests/testCases/cloudberryLoopModeTests.js'
      - 'frontend/modules/tutorials/content/procgen/cloudberry.js'
      - '.github/workflows/cloudberry-e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cloudberry-e2e:
    name: Cloudberry end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '~3.12.7'
          check-latest: true

      - name: Cache Python virtual environment
        uses: actions/cache@v6.1.0
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Create virtual environment and install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ModuleUpdate
        run: |
          source .venv/bin/activate
          # As test-templates.yml: an upstream world's loose floor (worlds/tloz `bsdiff4>=1.2.2`) upgrades past the
          # root pin (`bsdiff4==1.2.6`); `Launcher.py --update_settings` then asks "press enter to install" and dies
          # on EOF. Hold every exact root pin as a pip constraint for the world installs and the later steps.
          grep -E '^[A-Za-z0-9_.-]+==[^ #]+' requirements.txt | sed 's/[[:space:]]*#.*//' > "$RUNNER_TEMP/root-pins.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/root-pins.txt" >> "$GITHUB_ENV"
          PIP_CONSTRAINT="$RUNNER_TEMP/root-pins.txt" python ModuleUpdate.py --yes

      - name: Configure host settings (the preset recipe is minimal-spoilers)
        run: |
          source .venv/bin/activate
          python Launcher.py --update_settings
          python scripts/setup/update_host_settings.py minimal-spoilers

      - name: Player templates (Generate.py reads Players/)
        run: |
          source .venv/bin/activate
          python -c "from Options import generate_yaml_templates; generate_yaml_templates('Players/Templates')"

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download the live Cloudberry site (same-origin copy, gitignored)
        run: node scripts/setup/fetch-cloudberry-site.mjs

      - name: Start the dev server
        run: |
          python3 -m http.server 8000 >/tmp/httpd.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/frontend/ >/dev/null && break; sleep 1; done

      - name: check-cloudberry-sphere (generate, Generate.py, play to Victory)
        run: |
          source .venv/bin/activate
          node scripts/procgen/check-cloudberry-sphere.mjs --port 8000

      - name: check-cloudberry-sphere --check (the committed preset still regenerates)
        run: |
          source .venv/bin/activate
          node scripts/procgen/check-cloudberry-sphere.mjs --check

      - name: check-cloudberry-sphere --double-jump (the Double Jump world, played to Victory; then --check)
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          node scripts/procgen/check-cloudberry-sphere.mjs --double-jump --port 8000
          node scripts/procgen/check-cloudberry-sphere.mjs --double-jump --check

      - name: check-cloudberry-sphere --physics (the hero physics world, played to Victory; then --check)
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          node scripts/procgen/check-cloudberry-sphere.mjs --physics --port 8000
          node scripts/procgen/check-cloudberry-sphere.mjs --physics --check

      - name: check-cloudberry-embed (the demo pack in a spiral world, played; a sphere world from it, to Victory)
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          node scripts/procgen/check-cloudberry-embed.mjs --port 8000

      # The in-app rows (frontend/modules/tests/testCases/cloudberrySubstrateTests.js) + the tutorial walk:
      # npm test reuses the dev server above (playwright.config.js reuseExistingServer).
      - name: In-app tests (cloudberry batch)
        if: ${{ !cancelled() }}
        run: npm test -- --mode=test-substrates --batch=cloudberry

      - name: Budget headroom (cloudberry batch)
        if: ${{ !cancelled() }}
        run: node scripts/test/check-batch-headroom.js --mode=test-substrates --batch=cloudberry

      - name: Upload in-app test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.0
        with:
          name: cloudberry-in-app-results
          path: test-results/in-app-tests/
          if-no-files-found: ignore
