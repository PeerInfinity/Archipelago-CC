name: Generate Presets

on:
  workflow_dispatch:
    inputs:
      generate_multiworld:
        description: 'Generate multiworld presets'
        type: boolean
        default: true

      generate_extra_seeds:
        description: 'Generate seeds 2 and 3 for templates that support them'
        type: boolean
        default: true

      generate_worldgen:
        description: 'Generate worldgen worlds for standard templates'
        type: boolean
        default: false

      worldgen_canonical_seed1:
        description: 'Use canonical seed 1 placement for worldgen worlds'
        type: boolean
        default: true

      filter_presets:
        description: 'Filter preset changes to only include rules.json and sphere_log.jsonl files (excludes Spoiler.txt and .archipelago)'
        type: boolean
        default: true

permissions:
  contents: write  # Allow pushing commits and creating branches

jobs:
  generate-presets:
    name: Generate Presets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '~3.12.7'
          check-latest: true

      - name: Create or switch to generated-presets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin generated-presets; then
            git checkout generated-presets
            git pull origin generated-presets
            git rm -rf .
            git checkout origin/main -- .
            if ! git diff --staged --quiet; then
              git commit -m "Sync generated-presets with main"
              git push origin generated-presets
            fi
          else
            git checkout -b generated-presets origin/main
          fi

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt -y install python3-gi libgirepository1.0-dev

      - name: Cache Python virtual environment
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Create virtual environment and install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ModuleUpdate
        run: |
          source .venv/bin/activate
          python ModuleUpdate.py --yes

      - name: Generate template files
        run: |
          source .venv/bin/activate
          python -c "from Options import generate_yaml_templates; generate_yaml_templates('Players/Templates')"

      - name: Configure host settings
        run: |
          source .venv/bin/activate
          python Launcher.py --update_settings
          python scripts/setup/update_host_settings.py minimal-spoilers

      - name: Run generate script
        env:
          PYTHONUNBUFFERED: "1"
          GENERATE_MULTIWORLD: ${{ inputs.generate_multiworld }}
          GENERATE_EXTRA_SEEDS: ${{ inputs.generate_extra_seeds }}
          GENERATE_WORLDGEN: ${{ inputs.generate_worldgen }}
          WORLDGEN_CANONICAL_SEED1: ${{ inputs.worldgen_canonical_seed1 }}
        run: |
          source .venv/bin/activate
          chmod +x scripts/utils/generate_all_templates.sh
          scripts/utils/generate_all_templates.sh

      - name: Commit and push generated presets
        env:
          FILTER_PRESETS: ${{ inputs.filter_presets }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$FILTER_PRESETS" = "true" ]; then
            echo "Filtering presets: only staging rules.json, sphere_log.jsonl, and preset_files.json"

            # Add all changes outside frontend/presets/
            git add -A -- ':!frontend/presets/'

            # Add only allowed file types in frontend/presets/
            git add -- 'frontend/presets/preset_files.json' 2>/dev/null || true
            git add -- 'frontend/presets/**/*_rules.json' 2>/dev/null || true
            git add -- 'frontend/presets/**/*_sphere_log.jsonl' 2>/dev/null || true

            # Stage any deletions in frontend/presets/ (deletions are allowed for all file types)
            git diff --name-only --diff-filter=D -- frontend/presets/ | xargs -r git add --
          else
            git add -A
          fi

          if ! git diff --staged --quiet; then
            git commit -m "Generate presets

            Generated by workflow run: ${{ github.run_id }}
            "
            git push origin generated-presets
          fi
