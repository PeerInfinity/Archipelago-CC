# The standing spoiler-test row for the Upstream Rules Add-on's stripped documents
# (scripts/test/upstream_rules_addon_spoiler_row.py): nine presets whose own spoiler test passes, each tested
# unstripped (the control) and after the add-on's own strips (strip_level play), plus one negative control that must
# fail. Run it when the strip list, the presets or the client's logic change: a new reader of a stripped field is
# what it guards against. Roster and cost: the strip spoiler sweep's proposal (about 6 minutes).
# Reads nothing secret, writes nothing, deploys nothing.
name: upstream-rules-addon-spoiler-row

on:
  # MANUAL ONLY (Robert, 2026-11-16: "I don't want these tests run in every push"):
  # gh workflow run upstream-rules-addon-spoiler-row.yml -R PeerInfinity/Archipelago-CC --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  spoiler-row:
    name: Stripped documents' spoiler row
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - name: Cache Node.js dependencies
        uses: actions/cache@v6.1.0
        id: cache-node
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Node.js dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm install
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Spoiler-test the stripped documents
        run: |
          python -m http.server 8000 > /dev/null 2>&1 &
          sleep 2
          python scripts/test/upstream_rules_addon_spoiler_row.py --out "$RUNNER_TEMP/row-out"
      - name: Upload the row's results
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: upstream-rules-addon-spoiler-row
          path: ${{ runner.temp }}/row-out/
          if-no-files-found: ignore
          retention-days: 14
