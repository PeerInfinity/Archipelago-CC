<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Adventure (wrapper)</title>
    <link rel="stylesheet" href="../textAdventureEngine/engine.css">
    <style>
        html, body { height: 100%; margin: 0; background: #1a1a1a; }
        body { display: flex; flex-direction: column; }
        #status {
            padding: 4px 8px;
            background: #2d2d2d;
            border-bottom: 1px solid #444;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #888;
            flex-shrink: 0;
        }
        #status.connected { color: #88cc88; background: #1a2d1a; }
        #status.error { color: #cc8888; background: #2d1a1a; }
        #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div id="status">Connecting…</div>
    <div id="app"></div>
    <script type="module" src="./bridge.js"></script>
</body>
</html>
