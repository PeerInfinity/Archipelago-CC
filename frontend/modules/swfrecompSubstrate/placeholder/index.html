<!DOCTYPE html>
<!--
  Placeholder game page for the swfrecompSubstrate (v1).

  Stands in for the real recompiled Flash game page (SWF -> WASM via
  SWFRecomp-CC) until that page exists. It exposes the same __swfBridge
  contract the real page must expose:

    window.__swfBridge = {
      configure(cfg),   // host -> game: gameId / params / ap_items / ap_locations
      pollItems(items), // host -> game: received items to apply
      // sendLocation is wired by bridge.js (game -> host), but the page
      // may also call it directly.
    }

  The page renders the configured region + objective buttons so a human
  (or a test) can drive sendLocation and watch user:locationCheck flow
  through to the host. The real recompiled page will instead call
  __swfBridge.sendLocation from ActionScript via the runtime's
  ExternalInterface outward path.

  bridge.js is injected by swfrecompSubstratePanel after this page loads;
  it adds __swfBridge.sendLocation and completes the iframeAdapter
  handshake.
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>SWFRecomp substrate — placeholder</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #1e1e1e;
            color: #ddd;
            font-family: system-ui, sans-serif;
        }
        #app {
            box-sizing: border-box;
            padding: 16px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .banner {
            font-size: 13px;
            color: #888;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .region {
            font-size: 15px;
        }
        .region b { color: #6cf; }
        .objectives {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: auto;
        }
        button.obj {
            text-align: left;
            background: #2a2a2a;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px 10px;
            cursor: pointer;
        }
        button.obj:hover { background: #333; }
        button.obj:disabled {
            opacity: 0.5;
            cursor: default;
            border-style: dashed;
        }
        .empty { color: #777; font-style: italic; }
        #items { font-size: 12px; color: #8a8; }
    </style>
</head>
<body>
    <div id="app">
        <div class="banner">SWFRecomp substrate — placeholder game (no real WASM yet)</div>
        <div class="region" id="region">Waiting for a region…</div>
        <div class="objectives" id="objectives"></div>
        <div id="items"></div>
    </div>

    <script>
        (function () {
            const regionEl = document.getElementById('region');
            const objectivesEl = document.getElementById('objectives');
            const itemsEl = document.getElementById('items');

            let currentConfig = null;

            function renderObjectives() {
                objectivesEl.innerHTML = '';
                const locations = currentConfig?.ap_locations ?? {};
                const names = Object.keys(locations);
                if (names.length === 0) {
                    const div = document.createElement('div');
                    div.className = 'empty';
                    div.textContent = 'No objectives mapped for this region.';
                    objectivesEl.appendChild(div);
                    return;
                }
                for (const flashName of names) {
                    const btn = document.createElement('button');
                    btn.className = 'obj';
                    btn.textContent = `Complete objective: ${flashName} (-> ${locations[flashName]})`;
                    btn.addEventListener('click', () => {
                        // The real game calls this from ActionScript on
                        // objective completion; here a human/test clicks.
                        if (typeof window.__swfBridge?.sendLocation === 'function') {
                            window.__swfBridge.sendLocation(flashName);
                            btn.disabled = true;
                        } else {
                            console.warn('[swfrecomp-placeholder] __swfBridge.sendLocation not wired yet');
                        }
                    });
                    objectivesEl.appendChild(btn);
                }
            }

            // Expose the __swfBridge contract the host configures through.
            // bridge.js merges sendLocation onto this object.
            window.__swfBridge = window.__swfBridge || {};

            window.__swfBridge.configure = function (cfg) {
                currentConfig = cfg || {};
                regionEl.innerHTML =
                    `Region <b>${cfg?.regionId ?? '?'}</b> — game <b>${cfg?.gameId ?? '?'}</b>`;
                renderObjectives();
                console.log('[swfrecomp-placeholder] configure', cfg);
            };

            window.__swfBridge.pollItems = function (items) {
                const count = Array.isArray(items) ? items.length : 0;
                itemsEl.textContent = `Received items applied: ${count}`;
                console.log('[swfrecomp-placeholder] pollItems', items);
            };

            console.log('[swfrecomp-placeholder] page ready; __swfBridge contract exposed');
        })();
    </script>
</body>
</html>
