<!DOCTYPE html>
<!--
  seedlingDemo/watch.html — watch a Seedling bot tape, replayed or SOLVED.

  TOOLING ONLY: this page makes no claims and gates nothing. See
  watchViewer.js's docblock, and docs/json/developer/procgen/seedling-bot.md
  § "The editor arc" for what this page is and its named limits.

  Serve from the REPO ROOT (paths resolve against the dev server's cwd):

      ss -ltn | grep ":8000" || python3 -m http.server 8000

  ── SOURCE = REPLAY (the original page, untouched) ──────────────────────

      http://localhost:8000/frontend/modules/seedlingDemo/watch.html
          ?tape=frontend/modules/seedlingDemo/fixtures/tapes/pit-fall-chain-85.json
          &side=js

  side=js    the JS engine, drawn on canvas. Works anywhere.
  side=wasm  the real recompiled game in an iframe. LOCAL ONLY — the wasm
             artifact is gitignored, and the page says so by name when it
             is absent rather than showing a blank frame.

  ── SOURCE = SOLVE (editor arc slice 1) ─────────────────────────────────

  Pick a level, declare the starting conditions (a tape v8 staging block,
  either typed or preset from a committed tape's own boot), name the goals
  in the solver's own vocabulary, and press SOLVE. The bot solves in the
  page and the result is scrubbed by the SAME machinery REPLAY uses
  (solve-then-scrub).

      watch.html?boot=frontend/modules/seedlingDemo/fixtures/tapes/r7-act2-4.json
          &level=4&goals=exit:64,16&solve=1

  ?level=N     the level to solve in (overrides the staging block's own)
  ?boot=PATH   repo-relative JSON: a whole committed tape, or a bare block
  ?goals=      `exit:X,Y` / `place:X,Y`, `;`-separated, in solve order
  ?solve=1     solve on load (without ?goals=, the level's default — which
               REFUSES rather than guessing when the level has two exits)
  ?name=       the tape/trace name the solve is recorded under, in memory

  ── OVERLAYS + THE TRACE PANE (editor arc slice 2) ──────────────────────

  Every layer is an independently toggleable pass drawn from per-tick
  SAMPLES taken inside the one loop — never a second simulation. The
  checkboxes under the canvas are generated from the layer roster itself,
  the legend names every glyph, and ?layers= selects the ON set:

      &layers=player,enemies,action,damage

  player · enemies (chasers + spinners) · pushables · arrows (OFF by
  default, ⚖) · action (attack-key edges) · damage (hits + deaths) ·
  events (grants + transitions) · volumes.

  The pane on the right renders the decision trace: an in-page SOLVE's own
  rows, or the fetched fixtures/traces/<name>.trace.json sidecar for a
  committed solver tape. Rows at or before the scrub cursor are lit, and
  clicking one seeks to its tick. A tape with no trace says so BY NAME.

  ── SOURCE = MANUAL, AND TAPE I/O (editor arc slice 3) ──────────────────

  Declare the same starting conditions, press START, and drive the player
  yourself — arrow keys, X (attack) and C (item slot), at the page's own
  pacing (the speed slider applies). Every tick is recorded and the live
  overlays are the SAME per-tick sampling the replay uses. STOP folds the
  session into a tape with the ONE fold, checks that the fold REPLAYS
  frame-for-frame through the page's own REPLAY arm, and shows the tape in
  the save box.

      watch.html?source=manual&boot=…/tapes/r7-act2-4.json&level=4

  ⚠ MANUAL is never inferred — `?level=`/`?boot=` are shared with SOLVE, so
  it must be asked for by name.

  SAVE / LOAD: the current tape — replayed, solved or hand-driven — is in
  the textarea under the canvas, with a Download button beside it. Paste one
  in and press Load, or Upload a file; both go through `parseTape`, so a
  malformed tape refuses with the PARSER's own message.

  ── URL PARAMETERS, THE WHOLE SET ───────────────────────────────────────

  ?tape=   ?side=js|wasm   ?speed=N   ?source=replay|solve|manual
  ?level=N   ?boot=PATH   ?goals=   ?solve=1   ?name=
  ?layers=a,b,c   ?tick=N   ?shot=1

  ?tick=N   the initial cursor. The page lands there PAUSED — landing and
            then playing forward would make the parameter a flicker. Out of
            range clamps AND says so in the detail bar.

  ?shot=1   ⛓ THE CLI'S CONTRACT (slice 4's exporter waits on this):
              1. nothing animates — the page starts paused, so the canvas
                 holds the requested tick indefinitely;
              2. the frame is DRAWN before the signal is raised — the seek
                 runs the full draw path synchronously;
              3. the signal is BOTH `document.body.dataset.shotReady === "1"`
                 (so a headless waiter needs no page evaluation) AND
                 `window.__editorShot = {ready, requested, tick, frames,
                 label, why}` (so the caller can assert WHICH tick was drawn
                 and why a request could not be honoured exactly).
            `__editorShot` is set on every replay; the body attribute only
            under `?shot=1`. A readout that existed only under the parameter
            would make the parameter untestable from the other side.

  ⛔ THE PAGE NEVER WRITES fixtures/tapes/ OR fixtures/traces/. That roster
  is disk-derived, so a saved experiment would silently join the
  differential. Solved and hand-driven tapes live in the page, in the save
  box, in your downloads directory and in your hands.

  ── THE CLI EXPORT (editor arc slice 4) ─────────────────────────────────

  Any view above, as a PNG, with no browser and no dev server — built for
  agent use, because an agent can Read a picture:

      node scripts/procgen/export-seedling-view.mjs --out=view.png \
          --tape=…/tapes/r8-solve-4.json --tick=171 --layers=player,arrows
      node scripts/procgen/export-seedling-view.mjs --out=solve.png --trace \
          --boot=…/tapes/r7-act2-4.json --level=4 --goals=exit:64,16 --solve=1

  It starts its own static server on a free port, forwards the parameters
  above verbatim, adds ?shot=1, and screenshots this page. ⛔ It draws
  NOTHING itself, and a run this page REFUSES exits non-zero with the run's
  own message and writes no file at all.

  Deliberately NOT a GL panel: no __BUNDLED_MODULES__ entry, no substrate
  registration. seedlingDemo is an engine-only module and a standalone
  static page needs neither.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seedling bot — watch</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #0b0b0e; color: #d8d8e0;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  header { padding: 8px 12px; border-bottom: 1px solid #24242c; }
  h1 { font-size: 13px; margin: 0 0 4px; font-weight: 600; }
  #title { color: #7fe0ff; font-weight: 400; }
  #status { font-size: 12px; }
  #status.ok { color: #7fd88f; }
  #status.bad { color: #ff8080; }
  #detail { font-size: 11px; color: #8a8a98; white-space: pre-wrap; margin-top: 2px; }
  main { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  #stage { flex: 1 1 auto; min-width: 0; }
  canvas { display: block; image-rendering: pixelated; background: #101014; }
  iframe { display: none; width: 100%; height: 560px; border: 1px solid #24242c; }
  #panel { flex: 0 0 320px; }
  .r { display: flex; justify-content: space-between; gap: 8px; padding: 2px 6px; border-bottom: 1px solid #1a1a20; }
  .r span { color: #8a8a98; }
  .r b { font-weight: 600; text-align: right; word-break: break-all; }
  .r.coerced b { color: #ffd75f; }
  .r.transport b { color: #ff9a6a; }
  #controls { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  button { background: #1e1e26; color: #d8d8e0; border: 1px solid #34343e; padding: 4px 12px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  input[type=range] { flex: 1 1 120px; min-width: 80px; }
  label { color: #8a8a98; display: flex; gap: 4px; align-items: center; }
  #pick { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  #pick label { color: #8a8a98; }
  #tapes { background: #1e1e26; color: #d8d8e0; border: 1px solid #34343e; padding: 2px 6px; max-width: 60vw; }
  #sidenote { color: #8a8a98; font-size: 11px; }
  #progress { height: 4px; background: #1a1a20; margin-top: 6px; }
  #bar { height: 100%; width: 0; background: #7fe0ff; }
  /* ── SOURCE = SOLVE ── */
  select, textarea { background: #1e1e26; color: #d8d8e0; border: 1px solid #34343e;
    padding: 2px 6px; font: inherit; }
  #solvePanel { border-top: 1px solid #24242c; margin-top: 6px; padding-top: 6px; }
  #solvePanel .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-bottom: 4px; }
  #solveGoalPick { max-width: 40vw; }
  #solveGoals { color: #7fe0ff; }
  #solveTime { color: #7fd88f; }
  #solveBoot { width: 100%; box-sizing: border-box; }
  #solveNote { color: #8a8a98; font-size: 11px; }
  summary { color: #8a8a98; cursor: pointer; }
  /* ── SOURCE = MANUAL + TAPE I/O (editor arc slice 3) ── */
  #manualPanel { border-top: 1px solid #24242c; margin-top: 6px; padding-top: 6px; }
  #manualPanel .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-bottom: 4px; }
  #manualBoot { width: 100%; box-sizing: border-box; }
  #manualNote { color: #8a8a98; font-size: 11px; }
  #manualKeys { color: #7fe0ff; font-size: 11px; }
  #tapeIO { margin-top: 8px; border-top: 1px solid #24242c; padding-top: 6px; }
  #tapeIO .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin: 4px 0; }
  #tapeName { color: #7fe0ff; }
  #tapeText { width: 100%; box-sizing: border-box; }
  #tapeNote { color: #8a8a98; font-size: 11px; white-space: pre-wrap; }
  /* ── OVERLAYS + TRACE PANE (editor arc slice 2) ── */
  #layers { display: flex; gap: 4px 14px; flex-wrap: wrap; margin: 4px 0; }
  #legend { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 11px;
    color: #8a8a98; margin-bottom: 6px; }
  .sw { display: flex; gap: 4px; align-items: center; }
  .sw i { width: 9px; height: 9px; display: inline-block; }
  #panel h2 { font-size: 11px; color: #8a8a98; font-weight: 600; margin: 10px 0 2px;
    text-transform: uppercase; letter-spacing: .06em; }
  #trace { max-height: 46vh; overflow-y: auto; border: 1px solid #1a1a20; }
  #trace .tr { padding: 3px 6px; border-bottom: 1px solid #1a1a20; cursor: pointer;
    opacity: .45; }
  #trace .tr:hover { background: #1a1a22; }
  #trace .tr.past { opacity: 1; }
  #trace .tr.now { background: #1e2a30; border-left: 2px solid #7fe0ff; }
  #trace .tr b { color: #7fe0ff; font-weight: 600; }
  #trace .g { color: #7fd88f; }
  #trace .o { color: #ff9a6a; }
  #trace .s { color: #ffd75f; }
  #trace .rj { color: #8a8a98; font-size: 11px; }
  #trace .rj.none { opacity: .55; }
  #trace .traceNone { padding: 6px; color: #8a8a98; font-size: 11px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Seedling bot — watch <span id="title"></span></h1>
  <div id="pick">
    <label for="source">source</label>
    <select id="source">
      <option value="replay">REPLAY — a committed tape</option>
      <option value="solve">SOLVE — the bot, in this page</option>
      <option value="manual">MANUAL — drive it yourself</option>
    </select>
    <span id="replayPick">
      <label for="tapes">tape</label>
      <select id="tapes" disabled><option>loading…</option></select>
      <span id="sidenote"></span>
    </span>
  </div>
  <div id="solvePanel" hidden>
    <div class="line">
      <label>level <input id="solveLevel" type="number" min="0" step="1" style="width:5em"></label>
      <label for="solvePreset">boot like</label>
      <select id="solvePreset"><option value="">— loading presets… —</option></select>
      <button id="solveGo">SOLVE</button>
      <span id="solveTime"></span>
    </div>
    <div class="line">
      <label for="solveGoalPick">goal</label>
      <select id="solveGoalPick"><option value="">— no level loaded —</option></select>
      <button id="solveGoalAdd">add</button>
      <button id="solveGoalClear">clear</button>
      <span id="solveGoals">—</span>
    </div>
    <!-- ⛓ THE FORM SITS ABOVE THE `<details>`, NOT INSIDE IT (slice 5). Its
         first cut was inside, where the whole point of it — reaching the two
         flags WITHOUT opening the raw editor — is undone by having to open
         the raw editor. Caught by the acceptance row's visibility check, not
         by looking at it. -->
    <div class="line" id="solveForm"><span>boot items:</span></div>
    <details>
      <summary>starting conditions — the tape v8 staging block, raw</summary>
      <textarea id="solveBoot" rows="12" spellcheck="false"></textarea>
      <div id="solveNote"></div>
    </details>
  </div>
  <div id="manualPanel" hidden>
    <div class="line">
      <label>level <input id="manualLevel" type="number" min="0" step="1" style="width:5em" disabled></label>
      <label for="manualPreset">boot like</label>
      <select id="manualPreset"><option value="">— loading presets… —</option></select>
      <button id="manualStart">START</button>
      <button id="manualStop" disabled>STOP &amp; fold</button>
      <span id="manualKeys"></span>
    </div>
    <div class="line" id="manualForm"><span>boot items:</span></div>
    <details>
      <summary>starting conditions — the tape v8 staging block, raw</summary>
      <textarea id="manualBoot" rows="12" spellcheck="false"></textarea>
      <div id="manualNote"></div>
    </details>
  </div>
  <div id="status">loading…</div>
  <div id="detail"></div>
  <div id="progress"><div id="bar"></div></div>
</header>
<main>
  <div id="stage">
    <canvas id="canvas" width="320" height="320"></canvas>
    <iframe id="frame" title="recompiled Seedling"></iframe>
    <div id="controls">
      <button id="play">Pause</button>
      <input id="scrub" type="range" min="0" max="0" value="0">
      <label>speed <input id="speed" type="range" min="0.1" max="8" step="0.1" value="1"><span id="speedv">1x</span></label>
    </div>
    <div id="layers"></div>
    <div id="legend"></div>
    <details id="tapeIO">
      <summary>save / load — the tape in your hands (this page NEVER writes fixtures/)</summary>
      <div class="line">
        <span id="tapeName"></span>
        <button id="tapeDownload">Download</button>
        <button id="tapeLoad">Load from box</button>
        <label>Upload <input id="tapeUpload" type="file" accept=".json,application/json"></label>
      </div>
      <textarea id="tapeText" rows="10" spellcheck="false"></textarea>
      <div id="tapeNote"></div>
    </details>
  </div>
  <div id="panel">
    <div id="hud"></div>
    <h2>decision trace</h2>
    <div id="trace"></div>
  </div>
</main>
<script type="module">
  import { main } from './watchViewer.js';
  main();
</script>
</body>
</html>
