<!DOCTYPE html>
<html lang="en">
  <head>
    <title>JSON Web Client</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="styles/index.css" />
    <link rel="stylesheet" type="text/css" href="styles/loading-screen.css" />
    <link rel="stylesheet" type="text/css" href="styles/mobile.css" />

    <!-- Golden Layout CSS -->
    <link
      type="text/css"
      rel="stylesheet"
      href="libs/golden-layout/css/goldenlayout-base.css"
    />
    <link
      type="text/css"
      rel="stylesheet"
      href="libs/golden-layout/css/themes/goldenlayout-dark-theme.css"
    />

    <script type="module">
      // Support both bundled and unbundled loading modes:
      // - ?dev or ?unbundled: Force unbundled mode (ES modules)
      // - ?bundled: Force bundled mode
      // - Local development (localhost): Default to unbundled
      // - Deployed (other hosts): Try bundled first, fall back to unbundled
      const params = new URLSearchParams(location.search);
      const forceUnbundled = params.has('dev') || params.has('unbundled');
      const forceBundled = params.has('bundled');
      const isLocalDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

      function showLoadError(message, details) {
        const screen = document.getElementById('loading-screen');
        if (!screen) return;
        const content = screen.querySelector('.loading-content');
        if (!content) return;
        // Hide spinner
        const spinner = content.querySelector('.loading-spinner');
        if (spinner) spinner.style.display = 'none';
        // Replace "Loading..." text
        const loadingText = content.querySelector('p');
        if (loadingText) loadingText.textContent = 'Loading failed';
        // Add error details
        const errorDiv = document.createElement('div');
        errorDiv.style.cssText = 'color: #ff6b6b; padding: 1rem; margin-top: 1rem; max-width: 400px;';
        errorDiv.innerHTML =
          `<p style="margin-bottom: 0.5rem;">${message}</p>` +
          (details ? `<p style="font-size: 0.8rem; color: #999;">${details}</p>` : '') +
          '<p style="font-size: 0.8rem; color: #999; margin-top: 0.5rem;">Try refreshing, or check your network connection.</p>';
        content.appendChild(errorDiv);
      }

      async function loadApp() {
        if (forceUnbundled) {
          console.log('[Loader] Using unbundled mode (ES modules)');
          await import('./init.js');
          return;
        }

        if (forceBundled) {
          console.log('[Loader] Using bundled mode');
          await import('./dist/bundle.js');
          return;
        }

        // Local development: default to unbundled (no HEAD request noise)
        if (isLocalDev) {
          console.log('[Loader] Using unbundled mode (local development)');
          await import('./init.js');
          return;
        }

        // Deployed: try bundled first, fall back to unbundled
        // Only fall back to unbundled if the bundle doesn't exist (404).
        // On network errors, don't fall back — unbundled mode makes 200+ requests
        // which will be even worse on a flaky connection.
        let bundleExists = false;
        try {
          const response = await fetch('./dist/bundle.js', { method: 'HEAD' });
          bundleExists = response.ok;
        } catch (e) {
          // Network error on HEAD request — can't determine if bundle exists.
          // Try importing it directly (the browser may have it cached).
          console.warn('[Loader] HEAD request failed, attempting bundle import anyway:', e.message);
          bundleExists = true;
        }

        if (bundleExists) {
          console.log('[Loader] Using bundled mode (auto-detected)');
          await import('./dist/bundle.js');
        } else {
          console.log('[Loader] Bundle not found (404), using unbundled mode');
          await import('./init.js');
        }
      }

      loadApp().catch(e => {
        console.error('[Loader] Failed to load application:', e);
        showLoadError(
          'Could not load the application.',
          e.message || 'Unknown error'
        );
      });
    </script>

    <link rel="icon" href="data:," type="image/x-icon" />
  </head>
  <body>
    <!-- Simple static loading screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <h1>Archipelago JSON Tool</h1>
        <div class="loading-spinner"></div>
        <p>Loading...</p>
        <div class="loading-counter">
          <span id="files-loaded-count">0</span> files loaded
        </div>
        <div id="network-status" style="font-size: 0.8rem; margin-top: 0.3rem; color: #999; display: none;"></div>
        <div class="loading-file-list">
          <div class="file-list-header">Files loaded:</div>
          <div id="file-list-container" class="file-list-scroll">
            <!-- File names will be added here dynamically -->
          </div>
        </div>
      </div>
    </div>

    <script>
      // Inline network monitor — runs before module scripts load
      (function() {
        var el = document.getElementById('network-status');
        if (!el) return;
        function update() {
          if (!navigator.onLine) {
            el.style.display = 'block';
            el.style.color = '#ff6b6b';
            el.textContent = 'No network connection';
          } else {
            // Only show if it was previously visible (went offline then back)
            if (el.style.display === 'block') {
              el.style.color = '#90ee90';
              el.textContent = 'Connection restored — refreshing may help';
            }
          }
        }
        window.addEventListener('offline', update);
        window.addEventListener('online', update);
        // Check on load in case we started offline
        if (!navigator.onLine) update();
      })();
    </script>

    <div
      id="goldenlayout-container"
      style="width: 100%; height: 100vh; position: relative"
    >
      <!-- Golden Layout will populate this -->
    </div>

    <!-- Modal -->
    <div id="location-modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modal-title"></h3>
        <pre id="modal-debug" class="hidden"></pre>
        <div id="modal-info"></div>
        <button id="modal-close" class="button">Close</button>
      </div>
    </div>

    <div id="cookie-message">
      <span
        >This website uses cookies to store information about displayed
        content.</span
      >
      <span>❌</span>
    </div>
  </body>
</html>
