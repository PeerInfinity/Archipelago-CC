<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rule Format Converter</title>

    <!-- CodeMirror 6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/javascript/javascript.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/theme/dracula.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #16213e;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f3460;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #e94560;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header-controls select {
            background: #0f3460;
            color: #eee;
            border: 1px solid #e94560;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #0f3460;
        }

        .editor-pane:last-child {
            border-right: none;
        }

        .pane-header {
            background: #16213e;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #888;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f3460;
        }

        .pane-header .title {
            color: #ccc;
        }

        .pane-header .actions {
            display: flex;
            gap: 8px;
        }

        .pane-header button {
            background: #0f3460;
            color: #eee;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .pane-header button:hover {
            background: #e94560;
        }

        .editor-wrapper {
            flex: 1;
            overflow: hidden;
        }

        .CodeMirror {
            height: 100%;
            font-size: 14px;
            font-family: 'Fira Code', 'Monaco', 'Menlo', monospace;
        }

        .status-bar {
            background: #16213e;
            padding: 8px 20px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #0f3460;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.success {
            background: #4ade80;
        }

        .status-dot.error {
            background: #f87171;
        }

        .status-dot.warning {
            background: #fbbf24;
        }

        .status-message {
            color: #888;
        }

        .error-panel {
            background: #2d1b1b;
            border-top: 1px solid #5c2828;
            padding: 12px 20px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }

        .error-panel.visible {
            display: block;
        }

        .error-panel .error-title {
            color: #f87171;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .error-panel .error-content {
            font-family: monospace;
            font-size: 0.85rem;
            color: #fca5a5;
            white-space: pre-wrap;
        }

        .warnings-panel {
            background: #2d2a1b;
            border-top: 1px solid #5c5028;
            padding: 12px 20px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }

        .warnings-panel.visible {
            display: block;
        }

        .warnings-panel .warning-title {
            color: #fbbf24;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .warnings-panel .warning-item {
            font-size: 0.85rem;
            color: #fcd34d;
            margin-bottom: 4px;
        }

        /* Direction indicator */
        .direction-indicator {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e94560;
            font-size: 1.2rem;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .direction-indicator.visible {
            opacity: 1;
        }

        .main-content {
            position: relative;
        }

        /* Loading spinner */
        .loading {
            position: relative;
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 16px;
            height: 16px;
            border: 2px solid #0f3460;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <h1>Rule Format Converter</h1>
        <div class="header-controls">
            <label>
                Python format:
                <select id="python-format">
                    <option value="expression">Expression</option>
                    <option value="lambda">Lambda</option>
                    <option value="function">Function</option>
                </select>
            </label>
        </div>
    </header>

    <div class="main-content">
        <div class="editor-pane" id="python-pane">
            <div class="pane-header">
                <span class="title">Python</span>
                <div class="actions">
                    <button onclick="copyPython()">Copy</button>
                    <button onclick="formatPython()">Format</button>
                    <button onclick="clearPython()">Clear</button>
                </div>
            </div>
            <div class="editor-wrapper">
                <textarea id="python-editor"></textarea>
            </div>
        </div>

        <div class="direction-indicator" id="direction">→</div>

        <div class="editor-pane" id="json-pane">
            <div class="pane-header">
                <span class="title">JSON</span>
                <div class="actions">
                    <button onclick="copyJson()">Copy</button>
                    <button onclick="formatJson()">Format</button>
                    <button onclick="clearJson()">Clear</button>
                </div>
            </div>
            <div class="editor-wrapper">
                <textarea id="json-editor"></textarea>
            </div>
        </div>
    </div>

    <div class="warnings-panel" id="warnings-panel">
        <div class="warning-title">Warnings</div>
        <div class="warnings-list" id="warnings-list"></div>
    </div>

    <div class="error-panel" id="error-panel">
        <div class="error-title">Error</div>
        <div class="error-content" id="error-content"></div>
    </div>

    <div class="status-bar">
        <div class="status-left">
            <div class="status-indicator">
                <div class="status-dot" id="status-dot"></div>
                <span class="status-message" id="status-message">Ready</span>
            </div>
        </div>
        <div class="status-right">
            <span id="timing"></span>
        </div>
    </div>

    <script>
        // Initialize CodeMirror editors
        const pythonEditor = CodeMirror.fromTextArea(document.getElementById('python-editor'), {
            mode: 'python',
            theme: 'dracula',
            lineNumbers: true,
            indentUnit: 4,
            tabSize: 4,
            indentWithTabs: false,
            lineWrapping: true,
            autofocus: true
        });

        const jsonEditor = CodeMirror.fromTextArea(document.getElementById('json-editor'), {
            mode: { name: 'javascript', json: true },
            theme: 'dracula',
            lineNumbers: true,
            indentUnit: 2,
            tabSize: 2,
            indentWithTabs: false,
            lineWrapping: true
        });

        // State
        let debounceTimer = null;
        let lastEditedPane = null;
        let isConverting = false;

        // UI Elements
        const statusDot = document.getElementById('status-dot');
        const statusMessage = document.getElementById('status-message');
        const timing = document.getElementById('timing');
        const errorPanel = document.getElementById('error-panel');
        const errorContent = document.getElementById('error-content');
        const warningsPanel = document.getElementById('warnings-panel');
        const warningsList = document.getElementById('warnings-list');
        const directionIndicator = document.getElementById('direction');
        const pythonFormatSelect = document.getElementById('python-format');

        // Utility functions
        function setStatus(type, message) {
            statusDot.className = 'status-dot ' + type;
            statusMessage.textContent = message;
        }

        function showError(error) {
            errorPanel.classList.add('visible');
            errorContent.textContent = error;
            setStatus('error', 'Error');
        }

        function hideError() {
            errorPanel.classList.remove('visible');
        }

        function showWarnings(warnings) {
            if (warnings && warnings.length > 0) {
                warningsPanel.classList.add('visible');
                warningsList.innerHTML = warnings.map(w =>
                    `<div class="warning-item">• ${escapeHtml(w)}</div>`
                ).join('');
            } else {
                warningsPanel.classList.remove('visible');
            }
        }

        function hideWarnings() {
            warningsPanel.classList.remove('visible');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showDirection(dir) {
            directionIndicator.textContent = dir;
            directionIndicator.classList.add('visible');
            setTimeout(() => directionIndicator.classList.remove('visible'), 500);
        }

        // Conversion functions
        async function convertPythonToJson(code) {
            if (isConverting) return;
            isConverting = true;

            try {
                const response = await fetch('/api/python-to-json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });

                const data = await response.json();

                if (data.success) {
                    hideError();
                    showWarnings(data.warnings);

                    if (data.result !== null) {
                        const jsonStr = JSON.stringify(data.result, null, 2);
                        jsonEditor.setValue(jsonStr);
                    } else {
                        jsonEditor.setValue('');
                    }

                    timing.textContent = `${data.elapsed_ms}ms`;
                    setStatus('success', 'Converted');
                } else {
                    showError(data.error);
                }
            } catch (e) {
                showError('Network error: ' + e.message);
            } finally {
                isConverting = false;
            }
        }

        async function convertJsonToPython(jsonStr) {
            if (isConverting) return;
            isConverting = true;

            try {
                // First validate JSON
                let rule;
                try {
                    rule = JSON.parse(jsonStr);
                } catch (e) {
                    showError('Invalid JSON: ' + e.message);
                    isConverting = false;
                    return;
                }

                const format = pythonFormatSelect.value;

                const response = await fetch('/api/json-to-python', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rule, format })
                });

                const data = await response.json();

                if (data.success) {
                    hideError();
                    showWarnings(data.warnings);
                    pythonEditor.setValue(data.result || '');
                    timing.textContent = `${data.elapsed_ms}ms`;
                    setStatus('success', 'Converted');
                } else {
                    showError(data.error);
                }
            } catch (e) {
                showError('Network error: ' + e.message);
            } finally {
                isConverting = false;
            }
        }

        // Debounced conversion
        function scheduleConversion(source) {
            if (debounceTimer) {
                clearTimeout(debounceTimer);
            }

            setStatus('', 'Typing...');
            hideError();
            hideWarnings();

            debounceTimer = setTimeout(() => {
                if (source === 'python') {
                    const code = pythonEditor.getValue();
                    if (code.trim()) {
                        showDirection('→');
                        convertPythonToJson(code);
                    } else {
                        jsonEditor.setValue('');
                        setStatus('', 'Ready');
                    }
                } else if (source === 'json') {
                    const json = jsonEditor.getValue();
                    if (json.trim()) {
                        showDirection('←');
                        convertJsonToPython(json);
                    } else {
                        pythonEditor.setValue('');
                        setStatus('', 'Ready');
                    }
                }
            }, 500);
        }

        // Event listeners
        pythonEditor.on('change', (cm, change) => {
            if (change.origin !== 'setValue') {
                lastEditedPane = 'python';
                scheduleConversion('python');
            }
        });

        jsonEditor.on('change', (cm, change) => {
            if (change.origin !== 'setValue') {
                lastEditedPane = 'json';
                scheduleConversion('json');
            }
        });

        pythonFormatSelect.addEventListener('change', () => {
            if (jsonEditor.getValue().trim()) {
                convertJsonToPython(jsonEditor.getValue());
            }
        });

        // Button actions
        function copyPython() {
            navigator.clipboard.writeText(pythonEditor.getValue());
            setStatus('success', 'Copied Python');
        }

        function copyJson() {
            navigator.clipboard.writeText(jsonEditor.getValue());
            setStatus('success', 'Copied JSON');
        }

        function formatPython() {
            // Python formatting would require a backend call
            // For now, just trim whitespace
            pythonEditor.setValue(pythonEditor.getValue().trim());
        }

        function formatJson() {
            try {
                const json = JSON.parse(jsonEditor.getValue());
                jsonEditor.setValue(JSON.stringify(json, null, 2));
                setStatus('success', 'Formatted');
            } catch (e) {
                showError('Cannot format: Invalid JSON');
            }
        }

        function clearPython() {
            pythonEditor.setValue('');
            hideError();
            hideWarnings();
            setStatus('', 'Ready');
        }

        function clearJson() {
            jsonEditor.setValue('');
            hideError();
            hideWarnings();
            setStatus('', 'Ready');
        }

        // Set initial example
        pythonEditor.setValue("state.has('Sword') and state.has('Shield')");
        scheduleConversion('python');
    </script>
</body>
</html>
