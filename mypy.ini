[mypy]
# Ignore missing imports for third-party libraries without type stubs
ignore_missing_imports = True

# Exclude scripts/lib from being treated as a top-level package
# to avoid the "found twice under different module names" error
exclude = (?x)(
    ^scripts/lib/  # scripts/lib is imported as lib.* not scripts.lib.*
  )

# Per-module settings for packages without stubs
[mypy-yaml.*]
ignore_missing_imports = True

[mypy-pony.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True

[mypy-docutils.*]
ignore_missing_imports = True

[mypy-astunparse.*]
ignore_missing_imports = True

[mypy-pyevermizer.*]
ignore_missing_imports = True

[mypy-flask_compress.*]
ignore_missing_imports = True

[mypy-worlds.*]
ignore_missing_imports = True
